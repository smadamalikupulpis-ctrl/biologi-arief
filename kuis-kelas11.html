<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuis Biologi Kelas 11</title>
<style>
:root{--navy:#1c4f82;--blue:#0d6efd;--grn:#198754;--red:#dc3545;--gold:#f5a300;--line:#dfe3e8;--fs:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:#f3f6fa;color:#1f2a37;font-size:var(--fs);line-height:1.55;padding-bottom:max(28px,env(safe-area-inset-bottom))}
header{background:linear-gradient(90deg,#16406c,#6a3fb5);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
header h1{margin:0;font-size:1.2em}
header small{opacity:.88;display:block;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border:0}
select{font:inherit;font-size:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:1.05em;color:var(--navy)}
.center{text-align:center}
.muted{color:#667;font-size:.9em}
.btn{display:inline-block;padding:11px 18px;border-radius:24px;background:var(--navy);color:#fff;font-weight:700;min-height:46px;text-align:center}
.btn.alt{background:#eaf2fb;color:var(--navy)}
.btn.warn{background:#fde8ea;color:var(--red)}
.btn.go{background:linear-gradient(90deg,#198754,#20a56a)}
.btn.block{display:block;width:100%;margin-top:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
label.f{display:block;font-weight:600;font-size:.9em;margin:12px 0 4px}
select#sel-kelas,select#sel-nama{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.pledge{display:flex;gap:10px;align-items:flex-start;margin-top:14px;background:#f6f1ff;border:1px solid #e1d6f7;border-radius:12px;padding:12px;font-size:.9em;cursor:pointer}
.pledge input{width:22px;height:22px;flex:none;margin-top:2px}
.spin{width:34px;height:34px;border:4px solid #dfe8f3;border-top-color:var(--navy);border-radius:50%;margin:6px auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Kuis */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:.95em;margin-bottom:6px}
.qhead .qt{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:700}
.bar{height:8px;background:#e5eaf1;border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6a3fb5,#0d6efd);transition:width .3s}
.tag{display:inline-block;background:#eaf2fb;color:var(--navy);border-radius:20px;padding:2px 10px;font-size:.78em;font-weight:700;margin-bottom:10px}
.stim{overflow-x:auto;margin-bottom:6px}
.stim p,.qtext p{margin:0 0 8px}
.stim table{border-collapse:collapse;font-size:.9em;margin:6px 0}
.stim th,.stim td{border:1px solid #cbd5e1;padding:5px 8px;text-align:left}
.stim th{background:#f1f5f9}
.stim svg{max-width:100%;height:auto}
.qtext{font-weight:600;margin:8px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;margin:0 0 10px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .lt{flex:none;width:28px;height:28px;border-radius:50%;background:#eaf2fb;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:.9em}
.opt .c{flex:1;min-width:0}
.opt .c p{margin:0}
.opt.sel{border-color:#6a3fb5;background:#f6f1ff}
.opt.sel .lt{background:#6a3fb5;color:#fff}
.opt.mc .lt{border-radius:8px}
.kat-wrap{overflow-x:auto}
table.kat{width:100%;border-collapse:collapse}
table.kat th{font-size:.82em;color:#556;padding:4px 6px}
table.kat td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle}
table.kat td p{margin:0}
table.kat td.ck{width:64px;text-align:center}
table.kat td.ck label{display:grid;place-items:center;min-height:44px;cursor:pointer}
table.kat input{width:24px;height:24px;accent-color:#6a3fb5}
.msg{color:var(--red);font-size:.88em;min-height:1.3em;margin-top:6px}

/* Hasil & leaderboard */
.big{font-size:3.2em;font-weight:800;color:var(--navy);line-height:1.1}
.sub{color:#556;margin-top:4px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#f1f5f9;border-radius:20px;padding:4px 12px;font-size:.88em;font-weight:600}
.ask{background:#f6f1ff;border:1px solid #e1d6f7}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid #eef1f5}
.lb-row:last-child{border-bottom:0}
.lb-row.me{background:#fff7dd;border-radius:10px}
.lb-rank{flex:none;width:34px;text-align:center;font-weight:800;font-size:1.05em}
.lb-name{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lb-name small,.lb-score small{display:block;font-weight:400;color:#667;font-size:.78em}
.lb-score{flex:none;text-align:right;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.own{margin-top:12px;background:#eaf2fb;border-radius:12px;padding:10px 12px;font-size:.92em}
a.link{color:var(--navy);text-decoration:underline;font-size:.88em;cursor:pointer}

/* Soal rumpang & susun */
.pic{display:block;width:100%;max-height:240px;object-fit:contain;background:#0c1930;border-radius:10px;margin:0 0 10px}
.sent{font-size:1.1em;line-height:2.5;margin-bottom:12px}
.slot{display:inline-block;min-width:5em;text-align:center;padding:0 8px;margin:0 2px;border-bottom:3px solid #b9a5e6;background:#f6f1ff;border-radius:8px 8px 0 0;color:#6a3fb5;font-weight:700;cursor:pointer;line-height:1.7}
.slot b{font-size:.75em;opacity:.85}
.slot.filled{background:#eaf7ef;border-bottom-color:#20a56a;color:#145c3a}
.slot.sel{outline:2px solid #6a3fb5;outline-offset:1px}
.bankbox{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.chip2{border:2px solid #d9cdf2;background:#fff;color:#4a2c8f;border-radius:20px;padding:8px 14px;font-weight:700;min-height:42px;font-size:.98em}
.chip2.used{background:#f1f3f5;color:#a0a8b1;border-color:var(--line);text-decoration:line-through;cursor:default}
.ansbox{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px;border:2px dashed #cbbfe8;border-radius:12px;background:#faf8ff;margin-bottom:12px;align-items:center}
.ansbox .ph{color:#9a8fb8;font-size:.9em}
.ansbox .chip2{background:#6a3fb5;color:#fff;border-color:#6a3fb5}
.mini{background:none;color:var(--navy);text-decoration:underline;font-size:.88em;padding:6px 2px}
@media(min-width:700px){:root{--fs:17px}}
</style>
</head>

// ====== UTIL ======
const $ = id => document.getElementById(id);
const app = $('app');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const fmtS = n => Number(n).toLocaleString('id-ID', { maximumFractionDigits: 1 });
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function view(html) { app.innerHTML = html; scrollTo(0, 0); }

async function api(body) {
  if (GAS_URL.indexOf('GANTI') === 0) throw new Error('Alamat server (GAS_URL) belum diisi oleh guru.');
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  let out;
  try { out = JSON.parse(await res.text()); } catch (e) { throw new Error('Respons server tidak terbaca. Periksa koneksi atau pengaturan deployment.'); }
  if (!out.success) throw new Error(out.error || 'Server menolak permintaan');
  return out;
}

let INIT = null;           // data awal dari server
let ME = { kelas: '', nama: '' };
let Q = null;              // state kuis berjalan
window.onbeforeunload = e => { if (Q && Q.active) { e.preventDefault(); e.returnValue = ''; } };

function loading(msg) { view(`<div class="card center"><div class="spin"></div><p>${esc(msg)}</p></div>`); }
function errorView(msg, retry, back) {
  view(`<div class="card"><h2>⚠️ Terjadi kendala</h2><p>${esc(msg)}</p>
    <button class="btn block" id="b-retry">Coba lagi</button>
    ${back ? '<button class="btn alt block" id="b-back">← Kembali</button>' : ''}</div>`);
  $('b-retry').onclick = retry;
  if (back) $('b-back').onclick = back;
}

// ====== LEADERBOARD ======
function papanHTML(p) {
  const rows = p.daftar.map(x => {
    const me = ME.nama && x.nama === ME.nama && x.kelas === ME.kelas;
    const rk = ['🥇','🥈','🥉'][x.rank - 1] || x.rank;
    return `<div class="lb-row ${me ? 'me' : ''}"><span class="lb-rank">${rk}</span>
      <span class="lb-name">${esc(x.nama)}<small>${esc(x.kelas)}${me ? ' · Anda' : ''}</small></span>
      <span class="lb-score">${fmtS(x.skor)}<small>⏱ ${fmtT(x.durasi)}</small></span></div>`;
  }).join('');
  let own = '';
  if (p.saya && !p.saya.diPapan) {
    let gap = '';
    if (p.batas !== null) {
      const g = p.batas - p.saya.skor;
      gap = g > 0.05 ? ` Skor peringkat ${p.topN} adalah <b>${fmtS(p.batas)}</b> (kurang ${fmtS(g)} poin).`
                     : ` Skormu setara peringkat ${p.topN}; selesaikan lebih cepat untuk masuk.`;
    }
    own = `<div class="own">Skor terbaikmu <b>${fmtS(p.saya.skor)}</b>, belum masuk ${p.topN} Besar.${gap}</div>`;
  }
  return `<div class="card"><h2>🏆 ${p.topN} Besar</h2>${rows || '<p class="muted">Belum ada skor yang masuk. Jadilah yang pertama!</p>'}${own}
    <p class="muted" style="margin:10px 0 0">Urutan: skor tertinggi, lalu waktu tercepat.</p></div>`;
}

async function showPapan(back) {
  loading('Memuat papan peringkat...');
  try {
    const r = await api({ action: 'papan', kelas: ME.kelas, nama: ME.nama });
    view(papanHTML(r.papan) + `<button class="btn alt block" id="b-ref">↻ Perbarui</button><button class="btn block" id="b-kb">← Kembali</button>`);
    $('b-ref').onclick = () => showPapan(back);
    $('b-kb').onclick = back;
  } catch (e) { errorView(e.message, () => showPapan(back), back); }
}

// ====== LOGIN ======
function renderLogin() {
  ME = { kelas: '', nama: '' };
  const kelasList = [...new Set(INIT.siswa.map(s => s.kelas))];
  view(`
    <div class="card">
      <h2>👤 Siapa kamu?</h2>
      <label class="f" for="sel-kelas">Kelas</label>
      <select id="sel-kelas"><option value="">— pilih kelas —</option>${kelasList.map(k => `<option>${esc(k)}</option>`).join('')}</select>
      <label class="f" for="sel-nama">Nama (sesuai absen)</label>
      <select id="sel-nama" disabled><option value="">— pilih nama —</option></select>
      <label class="pledge"><input type="checkbox" id="chk"><span>Saya memilih <b>nama saya sendiri</b> dan akan mengerjakan dengan jujur. Nilai hasil kerja sendiri lebih berharga daripada peringkat.</span></label>
      <button class="btn block" id="b-lanjut" disabled>Lanjut</button>
    </div>
    <button class="btn alt block" id="b-papan">🏆 Lihat ${INIT.papan.topN} Besar</button>`);
  const upd = () => { $('b-lanjut').disabled = !($('sel-kelas').value && $('sel-nama').value && $('chk').checked); };
  $('sel-kelas').onchange = () => {
    const k = $('sel-kelas').value;
    $('sel-nama').innerHTML = '<option value="">— pilih nama —</option>' + INIT.siswa.filter(s => s.kelas === k).map(s => `<option>${esc(s.nama)}</option>`).join('');
    $('sel-nama').disabled = !k; upd();
  };
  $('sel-nama').onchange = upd; $('chk').onchange = upd;
  $('b-papan').onclick = () => showPapan(renderLogin);
  $('b-lanjut').onclick = async () => {
    ME = { kelas: $('sel-kelas').value, nama: $('sel-nama').value };
    loading('Memeriksa data kamu...');
    try { renderStatus(await api({ action: 'status', kelas: ME.kelas, nama: ME.nama })); }
    catch (e) { errorView(e.message, () => $('b-lanjut') ? $('b-lanjut').click() : renderLogin(), renderLogin); }
  };
}

// ====== STATUS / KEPUTUSAN ======
function keputusanHTML(st) {
  const skorTxt = st.skorKe.map((s, i) => s === null ? '' : `<span class="chip">Percobaan ${i + 1}: ${fmtS(s)}</span>`).join('');
  if (st.terkunci) {
    return `<div class="card center"><h2>🔒 Nilaimu terkunci</h2>
      <div class="big">${fmtS(st.terbaik)}</div><div class="sub">skor terbaik yang dipakai</div>
      <div class="chips">${skorTxt}</div></div>`;
  }
  return `<div class="card ask center"><h2>Ingin mengulang kuis?</h2>
    <div class="chips">${skorTxt}<span class="chip">Terbaik: ${fmtS(st.terbaik)}</span></div>
    <p class="muted" style="margin:10px 0 0">Sisa <b>${st.sisa}</b> kesempatan. Yang dipakai adalah <b>nilai tertinggi</b>. Jika tidak mengulang, nilaimu dikunci.</p>
    <div class="stack"><button class="btn go" id="b-ulang">🔁 Ya, ulangi kuis</button>
    <button class="btn alt" id="b-kunci">🔒 Tidak, kunci nilaiku</button></div></div>`;
}
function bindKeputusan(st) {
  if (st.terkunci) return;
  $('b-ulang').onclick = startQuiz;
  let armed = false;
  $('b-kunci').onclick = async () => {
    const b = $('b-kunci');
    if (!armed) { armed = true; b.textContent = '⚠️ Yakin? Klik lagi untuk mengunci'; b.className = 'btn warn'; return; }
    loading('Mengunci nilai...');
    try { renderStatus(await api({ action: 'kunci', kelas: ME.kelas, nama: ME.nama })); }
    catch (e) { errorView(e.message, () => renderStatus(st), () => renderStatus(st)); }
  };
}

function renderStatus(st) {
  if (st.percobaan === 0) {
    view(`<div class="card center"><h2>👋 Halo, ${esc(ME.nama)}</h2>
      <p style="margin:0 0 6px">Kelas ${esc(ME.kelas)}</p>
      <div class="chips"><span class="chip">📝 ${INIT.total} soal</span><span class="chip">🔁 Maks. ${INIT.maks}× main</span><span class="chip">⭐ Nilai tertinggi dipakai</span></div>
      <p class="muted" style="margin:12px 0 0">Ada 3 jenis soal: pilihan ganda, rumpang, dan susun kalimat. Urutan soal diacak. Jawab semua soal lalu kirim. Kerjakan sendiri dan jujur ya!</p>
      <button class="btn go block" id="b-mulai">▶ Mulai Kuis</button></div>
      <p class="center"><a class="link" id="b-ganti">↩ Bukan saya / ganti nama</a></p>`);
    $('b-mulai').onclick = startQuiz;
  } else {
    view(`<div class="card center" style="padding:10px 16px"><b>${esc(ME.nama)}</b> · ${esc(ME.kelas)}</div>` + keputusanHTML(st) + papanHTML(st.papan) +
      `<p class="center"><a class="link" id="b-ganti">↩ Bukan saya / ganti nama</a></p>`);
    bindKeputusan(st);
  }
  $('b-ganti').onclick = renderLogin;
}

// ====== KUIS ======
const SOAL_BY_ID = Object.fromEntries(SOAL.map(s => [s.id, s]));
const JENIS = { pg: 'Pilihan ganda', rumpang: 'Rumpang', susun: 'Susun kalimat' };

async function startQuiz() {
  loading('Menyiapkan kuis...');
  try {
    const r = await api({ action: 'mulai', kelas: ME.kelas, nama: ME.nama });
    const daftar = r.ids.map(id => SOAL_BY_ID[id]);
    if (daftar.some(x => !x)) throw new Error('Versi halaman kuis tidak cocok dengan server. Muat ulang halaman, atau hubungi guru.');
    const items = shuffle(daftar).map(s => ({
      s,
      opts: s.opts ? shuffle(s.opts) : null,
      bank: s.bank ? shuffle(s.bank.map((w, i) => ({ i, w }))) : null
    }));
    Q = { ke: r.ke, items, i: 0, jawab: {}, t0: Date.now(), tm: null, active: true };
    Q.tm = setInterval(() => { const e = $('tm'); if (e) e.textContent = fmtT((Date.now() - Q.t0) / 1000); }, 1000);
    renderQ();
  } catch (e) {
    errorView(e.message, startQuiz, async () => { try { renderStatus(await api({ action: 'status', kelas: ME.kelas, nama: ME.nama })); } catch (_) { renderLogin(); } });
  }
}

function bangunPG(it, s) {
  $('area').innerHTML = it.opts.map((o, k) => `<label class="opt"><input type="radio" name="o" value="${o.v}"><span class="lt">${'ABCD'[k]}</span><div class="c">${esc(o.h)}</div></label>`).join('');
  $('area').querySelectorAll('input').forEach(inp => inp.onchange = () => {
    $('qmsg').textContent = '';
    Q.jawab[s.id] = [inp.value];
    $('area').querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.querySelector('input').checked));
  });
}

function bangunRumpang(it, s) {
  const parts = s.templ.split(/\{\{(\d+)\}\}/);     // [teks, no, teks, no, ..., teks]
  const nB = it.bank.length;
  const slots = new Array(nB).fill(null);           // isi: indeks chip atau null
  let sel = 0;
  $('area').innerHTML = '<div class="sent" id="sent"></div><div class="bankbox" id="bankbox"></div><p class="muted" style="margin:10px 0 0">Ketuk kata untuk mengisi kotak yang menyala. Ketuk kata di dalam kalimat untuk melepasnya.</p>';
  function paint() {
    $('sent').innerHTML = parts.map((p, i) => i % 2 === 0 ? esc(p) :
      `<span class="slot ${slots[+p] !== null ? 'filled' : ''} ${sel === +p ? 'sel' : ''}" data-s="${p}">${slots[+p] !== null ? esc(it.bank[slots[+p]].w) : '<b>' + (+p + 1) + '</b>'}</span>`).join('');
    $('bankbox').innerHTML = it.bank.map((c, ci) => `<button class="chip2 ${slots.includes(ci) ? 'used' : ''}" data-c="${ci}" ${slots.includes(ci) ? 'disabled' : ''}>${esc(c.w)}</button>`).join('');
    $('sent').querySelectorAll('.slot').forEach(el => el.onclick = () => {
      const k = +el.dataset.s; $('qmsg').textContent = '';
      if (slots[k] !== null) slots[k] = null;
      sel = k; paint();
    });
    $('bankbox').querySelectorAll('.chip2').forEach(el => el.onclick = () => {
      const ci = +el.dataset.c; $('qmsg').textContent = '';
      let t = (sel !== null && slots[sel] === null) ? sel : slots.indexOf(null);
      if (t === -1) t = sel;                         // semua terisi: ganti isi kotak terpilih
      if (t === null || t === -1) return;
      slots[t] = ci;
      const nx = slots.indexOf(null);
      sel = nx === -1 ? t : nx;
      paint();
    });
    Q.jawab[s.id] = slots.map(ci => ci === null ? null : it.bank[ci].w);
  }
  paint();
}

function bangunSusun(it, s) {
  const ans = [];                                   // indeks chip sesuai urutan jawaban
  $('area').innerHTML = '<div class="ansbox" id="ansbox"></div><div class="bankbox" id="bankbox"></div><button class="mini" id="b-reset">↺ Ulangi dari awal</button>';
  function paint() {
    $('ansbox').innerHTML = ans.length ? ans.map((ci, k) => `<button class="chip2" data-k="${k}">${esc(it.bank[ci].w)}</button>`).join('') : '<span class="ph">Ketuk kata di bawah untuk menyusun kalimat…</span>';
    $('bankbox').innerHTML = it.bank.map((c, ci) => `<button class="chip2 ${ans.includes(ci) ? 'used' : ''}" data-c="${ci}" ${ans.includes(ci) ? 'disabled' : ''}>${esc(c.w)}</button>`).join('');
    $('ansbox').querySelectorAll('.chip2').forEach(el => el.onclick = () => { ans.splice(+el.dataset.k, 1); $('qmsg').textContent = ''; paint(); });
    $('bankbox').querySelectorAll('.chip2').forEach(el => el.onclick = () => { ans.push(+el.dataset.c); $('qmsg').textContent = ''; paint(); });
    Q.jawab[s.id] = ans.map(ci => it.bank[ci].w);
  }
  $('b-reset').onclick = () => { ans.length = 0; paint(); };
  paint();
}

function renderQ() {
  const it = Q.items[Q.i], s = it.s, n = Q.items.length;
  view(`
    <div class="qhead"><span>Soal <b>${Q.i + 1}</b> dari ${n}</span><span class="qt">⏱️ <span id="tm">${fmtT((Date.now() - Q.t0) / 1000)}</span></span></div>
    <div class="bar"><i style="width:${Q.i / n * 100}%"></i></div>
    <div class="card">
      <span class="tag">${esc(s.topik)} · ${JENIS[s.t]}</span>
      ${s.t === 'susun' ? `<img class="pic" src="${s.img}" alt="Gambar untuk soal ini"><div class="qtext">${esc(s.q)}</div><p class="muted" style="margin:0 0 10px">Susun kata-kata menjadi satu kalimat jawaban yang benar.</p>` : ''}
      ${s.t === 'pg' ? `<div class="qtext">${esc(s.q)}</div>` : ''}
      ${s.t === 'rumpang' ? '<div class="qtext">Lengkapi kalimat berikut dengan kata yang tepat.</div>' : ''}
      <div id="area"></div>
      <div class="msg" id="qmsg"></div>
      <button class="btn block ${Q.i === n - 1 ? 'go' : ''}" id="b-next">${Q.i === n - 1 ? '✅ Selesai & Kirim' : 'Lanjut →'}</button>
    </div>`);
  if (s.t === 'pg') bangunPG(it, s); else if (s.t === 'rumpang') bangunRumpang(it, s); else bangunSusun(it, s);

  $('b-next').onclick = () => {
    const a = Q.jawab[s.id];
    let ok, pesan;
    if (s.t === 'pg') { ok = a && a.length === 1; pesan = 'Pilih jawaban dulu.'; }
    else if (s.t === 'rumpang') { ok = a && a.length === it.bank.length && a.every(x => x !== null); pesan = 'Isi semua kotak yang kosong dulu.'; }
    else { ok = a && a.length === it.bank.length; pesan = 'Pakai semua kata untuk menyusun kalimat dulu.'; }
    if (!ok) { $('qmsg').textContent = pesan; return; }
    if (Q.i === n - 1) submit(); else { Q.i++; renderQ(); }
  };
}

async function submit() {
  clearInterval(Q.tm);
  loading('Mengirim jawaban dan menghitung skor...');
  try {
    const r = await api({ action: 'kirim', kelas: ME.kelas, nama: ME.nama, ke: Q.ke, jawaban: Q.jawab, durasiKlien: Math.floor((Date.now() - Q.t0) / 1000) });
    Q.active = false;
    renderHasil(r);
  } catch (e) {
    errorView(e.message + ' Jawabanmu masih tersimpan di halaman ini, jangan ditutup.', submit);
  }
}

function renderHasil(r) {
  const emo = r.skor >= 80 ? '🎉' : r.skor >= 60 ? '👏' : '💪';
  view(`<div class="card center"><div>${emo} Percobaan ${r.ke} selesai</div>
      <div class="big">${fmtS(r.skor)}</div>
      <div class="sub">${fmtS(r.benar)} dari ${r.total} poin</div>
      <div class="chips"><span class="chip">⏱️ ${fmtT(r.durasi)}</span><span class="chip">Terbaik: ${fmtS(r.terbaik)}</span></div></div>` +
    keputusanHTML(r) + papanHTML(r.papan) +
    `<p class="center"><a class="link" id="b-ganti">↩ Selesai / ganti nama</a></p>`);
  bindKeputusan(r);
  $('b-ganti').onclick = renderLogin;
}

// ====== INIT ======
async function boot() {
  loading('Memuat daftar siswa...');
  try { INIT = await api({ action: 'init' }); renderLogin(); }
  catch (e) { errorView(e.message, boot); }
}
boot();
</script>
</body>
</html>
