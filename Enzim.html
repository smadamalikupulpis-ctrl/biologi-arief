<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Materi Enzim</title>
<style>
:root{--navy:#1c4f82;--blue:#0d6efd;--grn:#198754;--red:#dc3545;--line:#dfe3e8;--fs:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:#f3f6fa;color:#1f2a37;font-size:var(--fs);line-height:1.55;padding-bottom:max(24px,env(safe-area-inset-bottom))}
header{background:linear-gradient(90deg,#16406c,#2a6097);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
header h1{margin:0;font-size:1.2em}
header small{opacity:.85;display:block;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:1.02em;color:var(--navy)}
.btn{padding:10px 18px;border-radius:22px;background:var(--navy);color:#fff;font-weight:600;min-height:44px}
.btn.alt{background:#eaf2fb;color:var(--navy)}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* Timer */
.timer-bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);margin:-16px -16px 14px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.92em}
.timer-bar .t-val{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;font-size:1.1em}
.timer-bar .t-ok{color:var(--grn)}
.timer-bar .t-warn{color:#c97a00}
.badge{background:#eaf2fb;color:var(--navy);border-radius:20px;padding:3px 10px;font-size:.8em;font-weight:600;white-space:nowrap}
.badge.warn{background:#fff3cd;color:#8a6d00}
.badge.ok{background:#e4f6ea;color:var(--grn)}

/* Petunjuk */
.step{display:flex;gap:10px;padding:5px 0;align-items:flex-start;font-size:.95em}
.step span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.8em;font-weight:700;margin-top:1px}

/* Kalimat rumpang berwarna */
.sent-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sent-h h2{margin:0}
.sent-prog{font-size:.8em;font-weight:700;color:#667;background:#f1f3f5;border-radius:20px;padding:2px 10px;white-space:nowrap}
.sent-prog.done{background:#e4f6ea;color:var(--grn)}
.para{font-size:1.08em;line-height:2.5;margin:0 0 10px}
.blank{display:inline-block;min-width:4.8em;margin:0 3px;padding:0 6px;text-align:center;line-height:1.35;
  border-bottom:4px solid var(--c);background:var(--t);border-radius:6px 6px 0 0;
  color:var(--c);font-size:.8em;font-weight:700;vertical-align:baseline}
.blank.filled{color:#1f2937;font-size:1em;font-weight:800;cursor:pointer}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.chip{border:2px solid transparent;border-radius:20px;padding:8px 14px;font-weight:700;min-height:42px;font-size:.98em;background:var(--c);color:var(--fg)}
.chip.used{background:#f1f3f5;color:#a0a8b1;border-color:var(--line);text-decoration:line-through;cursor:default}
.hint{font-size:.82em;color:#667;margin:8px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82em;margin-top:8px;color:#445}
.legend b{font-weight:700}

/* Foto */
.ph-slot{display:flex;flex-direction:column;gap:10px}
.ph-box{border:2px dashed #cbd5e1;border-radius:12px;background:#fafcff;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.ph-box img{width:100%;height:100%;object-fit:contain;background:#000}
.ph-slot.has .ph-box{border-style:solid;border-color:var(--grn)}
.ph-empty{color:#889;font-size:.9em;text-align:center;padding:8px}
.ph-btns{display:flex;gap:8px}
.ph-btns .btn{flex:1;padding:10px 6px;font-size:.92em;text-align:center;cursor:pointer;display:grid;place-items:center}
.ph-msg{font-size:.85em;min-height:1.2em;color:#667}
.ph-msg.err{color:var(--red)}
.ph-msg.ok{color:var(--grn)}

/* Ringkasan */
.summary-box{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.summary-box h3{margin:0 0 10px;font-size:1em;color:var(--navy)}
.summary-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:.92em}
.summary-row:last-of-type{border-bottom:0}
.summary-row span:first-child{color:#555}
.summary-row span:last-child{font-weight:600;text-align:right}
#btn-send{width:100%;margin-top:14px;min-height:48px}
.send-status{margin-top:10px;font-size:.88em;padding:8px 10px;border-radius:8px;display:none}
.send-status.ok{background:#e4f6ea;color:var(--grn);display:block}
.send-status.err{background:#fde8ea;color:var(--red);display:block}
.send-status.info{background:#eaf2fb;color:var(--navy);display:block}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto}
.modal-box{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal-box h2{margin:0 0 8px;color:var(--navy);font-size:1.15em}
.modal-box p{margin:0 0 14px;font-size:.92em;color:#444}
.modal-box label{display:block;font-weight:600;font-size:.9em;margin:10px 0 4px}
.modal-box input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px}
.modal-box input:focus{outline:2px solid var(--blue);border-color:transparent}
.modal-box .err{color:var(--red);font-size:.82em;margin-top:6px;display:none}
.modal-box button{margin-top:14px;width:100%}

@media(min-width:700px){:root{--fs:17px}.para{font-size:1.12em}}
</style>
</head>
<body>
<header><h1>🧬 Materi Enzim</h1><small>Cocokkan warna → tulis di buku → foto &amp; kirim</small></header>
<main id="app"></main>

<script>
// ====== KONFIGURASI ======
const MIN_MENIT = 10;                 // waktu belajar minimal (menit) <-- ubah di sini
const MIN_DETIK = MIN_MENIT * 60;
const GAS_URL = "https://script.google.com/macros/s/AKfycbz7UYG3QXqxRs5XolYAldjS2dT0e_yfeC3yWI416gwy4G5Sf5DnI3FUDpEWxmG-Gg/exec";
const JUDUL = "Materi Enzim";

// Tanda [[kata]] = bagian yang dirumpangkan
const PARAGRAF = [
  "Enzim [[mempercepat]] reaksi dengan <b>menurunkan batas [[energi]] minimal</b> yang [[diperlukan]] untuk memulai suatu reaksi [[kimia]].",
  "Berlaku [[prinsip]] <em>“one enzyme, one substrate”</em>: satu jenis [[enzim]] hanya mampu [[mengatalisis]] satu jenis reaksi dengan [[substrat]] yang cocok.",
  "Enzim tidak menentukan [[arah]] reaksi. Enzim yang sama bisa <b>[[menyusun]]</b> senyawa sederhana menjadi kompleks, atau <b>[[menguraikan]]</b> senyawa kompleks menjadi sederhana.",
  "Enzim [[tetap]] utuh setelah reaksi selesai, sehingga dapat [[digunakan]] <b>berulang kali</b> (<em>reusable</em>) dalam [[jumlah]] sedikit."
];

const KEY = 'enzim-belajar-v1';
const PHOTO_KEY = 'enzim-belajar-v1-foto';
const $ = id => document.getElementById(id);
const app = $('app');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Warna per urutan rumpang dalam satu kalimat (disertai simbol agar tetap jelas bagi siswa buta warna)
const WARNA = [
  { n: 'merah',  c: '#dc3545', t: '#fde8ea', fg: '#ffffff', s: '●' },
  { n: 'kuning', c: '#f5a300', t: '#fff4d6', fg: '#3b2a00', s: '▲' },
  { n: 'hijau',  c: '#198754', t: '#e4f6ea', fg: '#ffffff', s: '■' },
  { n: 'biru',   c: '#0d6efd', t: '#e7f0ff', fg: '#ffffff', s: '◆' }
];

// Per kalimat: kata rumpang diberi warna sesuai urutannya; bank kata diurutkan abjad
const KAL = PARAGRAF.map((txt, si) => {
  const kata = [];
  const html = txt.replace(/\[\[(.+?)\]\]/g, (_, w) => {
    const k = WARNA[kata.length % WARNA.length];
    kata.push({ w, k });
    return `<span class="blank" data-s="${si}" data-w="${esc(w)}" style="--c:${k.c};--t:${k.t}">${k.s}</span>`;
  });
  const bank = [...kata].sort((a, b) => a.w.localeCompare(b.w, 'id'));
  return { html, kata, bank };
});
const TOTAL_KATA = KAL.reduce((n, x) => n + x.kata.length, 0);
const fkey = (si, w) => si + ':' + w;

// ====== STATE ======
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { P = {}; }
if (!P.student) P.student = null;
if (!P.elapsed) P.elapsed = 0;
if (!P.lastTick) P.lastTick = null;
if (!P.reported) P.reported = false;
if (!P.fill) P.fill = {};

let resetting = false;
function save() { if (resetting) return; try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }

// Foto disimpan terpisah agar kuota penuh tidak merusak data waktu
let FOTO = '';
try { FOTO = localStorage.getItem(PHOTO_KEY) || ''; } catch(e) { FOTO = ''; }
function saveFoto() {
  if (resetting) return;
  try { FOTO ? localStorage.setItem(PHOTO_KEY, FOTO) : localStorage.removeItem(PHOTO_KEY); } catch(e) {}
}
let sending = false;

function formatTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ====== TIMER ======
let timerInterval = null;

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    P.lastTick = Date.now();   // waktu saat halaman tertutup tidak dihitung
    save();
  } else if (P.lastTick) {
    P.elapsed += Math.floor((Date.now() - P.lastTick) / 1000);
    save();
  }
});

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  updateTimerUI();
  timerInterval = setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (!P.lastTick) P.lastTick = Date.now();
    const now = Date.now();
    const selisih = Math.floor((now - P.lastTick) / 1000);
    if (selisih > 0 && selisih < 2) {
      P.elapsed += selisih;
      P.lastTick = now;
      save();
      updateTimerUI();
      refreshSendUI();
    } else {
      P.lastTick = now;
    }
  }, 1000);
}

function updateTimerUI() {
  const el = $('timer-display');
  if (!el) return;
  el.textContent = formatTime(P.elapsed);
  const cukup = P.elapsed >= MIN_DETIK;
  el.className = 't-val ' + (cukup ? 't-ok' : 't-warn');
  const badge = $('timer-badge');
  if (badge) {
    badge.className = 'badge ' + (cukup ? 'ok' : 'warn');
    badge.textContent = cukup ? '✅ Waktu cukup' : `⏳ Min. ${MIN_MENIT} menit`;
  }
}

// ====== FOTO ======
function compressImage(file, max = 1600, q = 0.75) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('File bukan gambar yang bisa dibaca')); };
    img.src = url;
  });
}

function slotHTML() {
  const has = !!FOTO;
  return `<div class="ph-slot ${has ? 'has' : ''}" id="ph-slot">
    <div class="ph-box">${has ? `<img src="${FOTO}" alt="Foto tulisan paragraf">` : '<div class="ph-empty">📓 Belum ada foto<br>tulisan paragrafmu</div>'}</div>
    <div class="ph-btns">
      <label class="btn">📷 ${has ? 'Foto ulang' : 'Kamera'}<input type="file" accept="image/*" capture="environment" hidden data-ph></label>
      <label class="btn alt">🖼️ Galeri<input type="file" accept="image/*" hidden data-ph></label>
    </div>
    <div class="ph-msg ${has ? 'ok' : ''}">${has ? '✅ Foto siap dikirim' : ''}</div>
  </div>`;
}

function bindPhoto() {
  document.querySelectorAll('input[data-ph]').forEach(inp => {
    inp.onchange = async () => {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const msg = document.querySelector('#ph-slot .ph-msg');
      msg.className = 'ph-msg'; msg.textContent = '⏳ Memproses foto...';
      try {
        FOTO = await compressImage(file);
        saveFoto();
        $('ph-slot').outerHTML = slotHTML();
        bindPhoto();
        refreshSendUI();
      } catch (err) {
        msg.className = 'ph-msg err';
        msg.textContent = '❌ ' + err.message;
      }
    };
  });
}

// ====== STATUS TOMBOL KIRIM ======
function sendState() {
  if (P.reported) return { ok: false, label: '✅ Anda sudah berhasil mengirimkan laporan' };
  if (!FOTO) return { ok: false, label: '📷 Unggah foto tulisanmu dulu' };
  if (P.elapsed < MIN_DETIK) return { ok: false, label: `🔒 Kirim Laporan (${formatTime(MIN_DETIK - P.elapsed)} lagi)` };
  return { ok: true, label: '📤 Kirim Laporan' };
}

function refreshSendUI() {
  const st = sendState();
  const btn = $('btn-send');
  if (btn && !sending) { btn.disabled = !st.ok; btn.textContent = st.label; }
  const t = $('summary-time'); if (t) t.textContent = formatTime(P.elapsed);
  const f = $('summary-foto'); if (f) f.textContent = FOTO ? '✅ Sudah ada' : '❌ Belum ada';
  const s = $('summary-status');
  if (s) s.textContent = P.elapsed >= MIN_DETIK ? `✅ Mencapai ${MIN_MENIT} menit` : `⏳ Belum ${MIN_MENIT} menit`;
}

// ====== TAMPILAN UTAMA ======
function findBlank(si, w) {
  return [...document.querySelectorAll('.blank')].find(b => +b.dataset.s === si && b.dataset.w === w);
}
function findChip(si, w) {
  return [...document.querySelectorAll('.chip')].find(c => +c.dataset.s === si && c.dataset.w === w);
}
function paintWord(si, o) {
  const on = !!P.fill[fkey(si, o.w)];
  const b = findBlank(si, o.w), c = findChip(si, o.w);
  if (b) { b.textContent = on ? o.w : o.k.s; b.classList.toggle('filled', on); }
  if (c) { c.classList.toggle('used', on); c.disabled = on; }
}
function paintProgress(si) {
  const n = KAL[si].kata.filter(o => P.fill[fkey(si, o.w)]).length;
  const el = $('prog-' + si);
  if (!el) return;
  el.textContent = n === KAL[si].kata.length ? '✅ Lengkap' : `${n}/${KAL[si].kata.length}`;
  el.classList.toggle('done', n === KAL[si].kata.length);
}
function bindSentences() {
  KAL.forEach((x, si) => { x.kata.forEach(o => paintWord(si, o)); paintProgress(si); });
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const si = +c.dataset.s, w = c.dataset.w;
    P.fill[fkey(si, w)] = true;
    paintWord(si, KAL[si].kata.find(o => o.w === w));
    paintProgress(si); save();
  });
  document.querySelectorAll('.blank').forEach(b => b.onclick = () => {
    const si = +b.dataset.s, w = b.dataset.w;
    if (!P.fill[fkey(si, w)]) return;
    P.fill[fkey(si, w)] = false;
    paintWord(si, KAL[si].kata.find(o => o.w === w));
    paintProgress(si); save();
  });
}

function renderMain() {
  const cukup = P.elapsed >= MIN_DETIK;
  const st = sendState();
  app.innerHTML = `
    <div class="timer-bar">
      <span>⏱️ <span id="timer-display" class="t-val ${cukup ? 't-ok' : 't-warn'}">${formatTime(P.elapsed)}</span></span>
      <span id="timer-badge" class="badge ${cukup ? 'ok' : 'warn'}">${cukup ? '✅ Waktu cukup' : `⏳ Min. ${MIN_MENIT} menit`}</span>
    </div>

    <div class="card">
      <h2>Halo, ${esc(P.student.nama)} (${esc(P.student.kelas)}) 👋</h2>
      <div class="step"><span>1</span><div><b>Cocokkan warna.</b> Ketuk sebuah kata, maka kata itu mengisi garis yang <b>warnanya sama</b>. Ketuk kata di dalam garis untuk melepasnya lagi.</div></div>
      <div class="step"><span>2</span><div><b>Tulis keempat kalimat yang sudah lengkap di buku tulismu</b>, berurutan sebagai satu paragraf.</div></div>
      <div class="step"><span>3</span><div>Foto tulisanmu, lalu kirim. Pastikan tulisan terbaca jelas.</div></div>
      <div class="legend">${WARNA.map(k => `<span><b style="color:${k.c}">${k.s}</b> ${k.n}</span>`).join('')}</div>
    </div>

    ${KAL.map((x, si) => `
    <div class="card" data-sent="${si}">
      <div class="sent-h"><h2>Kalimat ${si + 1} dari ${KAL.length}</h2><span class="sent-prog" id="prog-${si}"></span></div>
      <p class="para">${x.html}</p>
      <div class="bank">${x.bank.map(o => `<button class="chip" data-s="${si}" data-w="${esc(o.w)}" style="--c:${o.k.c};--fg:${o.k.fg}">${o.k.s} ${esc(o.w)}</button>`).join('')}</div>
    </div>`).join('')}

    <div class="card">
      <h2>📸 Foto Hasil Tulisan</h2>
      ${slotHTML()}
    </div>

    <div class="summary-box">
      <h3>📊 Ringkasan</h3>
      <div class="summary-row"><span>Nama</span><span>${esc(P.student.nama)}</span></div>
      <div class="summary-row"><span>Kelas</span><span>${esc(P.student.kelas)}</span></div>
      <div class="summary-row"><span>Waktu belajar</span><span id="summary-time">${formatTime(P.elapsed)}</span></div>
      <div class="summary-row"><span>Foto tulisan</span><span id="summary-foto">${FOTO ? '✅ Sudah ada' : '❌ Belum ada'}</span></div>
      <div class="summary-row"><span>Status waktu</span><span id="summary-status">${cukup ? `✅ Mencapai ${MIN_MENIT} menit` : `⏳ Belum ${MIN_MENIT} menit`}</span></div>
      <button class="btn" id="btn-send" ${st.ok ? '' : 'disabled'}>${st.label}</button>
      <div class="send-status" id="send-status"></div>
    </div>`;

  $('btn-send').onclick = sendReport;
  if (P.reported) {
    const ss = $('send-status');
    ss.className = 'send-status ok';
    ss.textContent = '✅ Laporan Anda sudah diterima guru. Tidak perlu mengirim ulang.';
  }
  bindSentences();
  bindPhoto();
  scrollTo(0, 0);
}

// ====== KIRIM LAPORAN ======
async function sendReport() {
  if (sending || P.reported) return;
  if (P.elapsed < MIN_DETIK) { alert(`Waktu belajar belum mencapai ${MIN_MENIT} menit. Terus belajar ya!`); return; }
  if (!FOTO) { alert('Foto tulisanmu belum ada.'); return; }
  if (!P.student) { alert('Data siswa tidak ditemukan.'); return; }

  const btn = $('btn-send');
  const status = $('send-status');
  if (GAS_URL.indexOf('GANTI') === 0) {
    status.className = 'send-status err';
    status.textContent = 'Alamat pengiriman (GAS_URL) belum diisi oleh guru.';
    return;
  }
  sending = true;
  btn.disabled = true;
  btn.textContent = '⏳ Mengirim...';
  status.className = 'send-status info';
  status.textContent = 'Sedang mengirim laporan dan foto, mohon tunggu...';

  const data = {
    action: 'addLaporan',
    nama: P.student.nama,
    kelas: P.student.kelas,
    waktuBelajarMenit: Math.floor(P.elapsed / 60),
    waktuBelajarDetik: P.elapsed,
    waktuKirim: new Date().toISOString(),
    judulTopik1: JUDUL,
    foto1: FOTO
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    const out = JSON.parse(await res.text());
    if (out.duplicate) {
      P.reported = true; save();
      status.className = 'send-status ok';
      status.textContent = '✅ ' + (out.error || 'Laporan atas nama ini sudah pernah diterima guru.');
      return;
    }
    if (!out.success) throw new Error(out.error || 'Server menolak data');
    P.reported = true;
    save();
    status.className = 'send-status ok';
    status.textContent = '✅ Laporan dan foto berhasil terkirim ke guru! Tidak perlu mengirim ulang.';
  } catch (err) {
    console.error(err);
    status.className = 'send-status err';
    status.textContent = 'Gagal mengirim: ' + (err.message || 'periksa koneksi internet') + '. Foto tetap tersimpan di perangkat, silakan coba kirim lagi.';
  } finally {
    sending = false;
    refreshSendUI();
  }
}

// ====== MODAL ======
function showModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h2>📋 Selamat Datang!</h2>
      <p>Hari ini kita belajar tentang <b>Enzim</b>. Waktu belajar minimal <b>${MIN_MENIT} menit</b>. Isi data diri dulu ya.</p>
      <label for="inp-nama">Nama Lengkap</label>
      <input id="inp-nama" type="text" placeholder="Contoh: Ahmad Fauzi" autocomplete="name">
      <label for="inp-kelas">Kelas</label>
      <input id="inp-kelas" type="text" placeholder="Contoh: XII IPA 1" autocomplete="off">
      <div class="err" id="modal-err">Nama dan kelas wajib diisi.</div>
      <button class="btn" id="btn-start">Mulai Belajar</button>
    </div>`;
  document.body.appendChild(overlay);
  $('btn-start').onclick = () => {
    const nama = $('inp-nama').value.trim();
    const kelas = $('inp-kelas').value.trim();
    if (!nama || !kelas) { $('modal-err').style.display = 'block'; return; }
    P.student = { nama, kelas };
    P.lastTick = Date.now();
    P.elapsed = 0;
    save();
    overlay.remove();
    startTimer();
    renderMain();
  };
  setTimeout(() => { const i = $('inp-nama'); if (i) i.focus(); }, 100);
}

function showResumeModal() {
  const o = document.createElement('div');
  o.className = 'modal-overlay';
  o.innerHTML = `
    <div class="modal-box">
      <h2>👋 Data belajar ditemukan</h2>
      <p>Perangkat ini masih menyimpan data atas nama <b>${esc(P.student.nama)}</b> (${esc(P.student.kelas)}):
      waktu belajar <b>${formatTime(P.elapsed)}</b>, foto tulisan <b>${FOTO ? 'sudah ada' : 'belum ada'}</b>.
      ${P.reported ? 'Laporan sudah <b>terkirim</b>.' : 'Laporan <b>belum dikirim</b>.'}</p>
      <button class="btn" id="btn-resume">Lanjutkan sebagai ${esc(P.student.nama)}</button>
      <button class="btn alt" id="btn-reset">Bukan saya / mulai baru</button>
      <p style="margin:10px 0 0;font-size:.8em;color:#666">Jika HP ini dipakai bergantian, pilih "Bukan saya". Data lama (nama, waktu, foto) akan dihapus dari perangkat ini.</p>
    </div>`;
  document.body.appendChild(o);
  $('btn-resume').onclick = () => {
    o.remove();
    P.lastTick = Date.now();   // waktu saat popup terbuka tidak dihitung
    save();
    startTimer();
    renderMain();
  };
  let armed = false;
  $('btn-reset').onclick = () => {
    const b = $('btn-reset');
    if (!armed) {
      armed = true;
      b.textContent = '⚠️ Ya, hapus semua data & mulai baru';
      b.style.background = '#fde8ea';
      b.style.color = '#dc3545';
      return;
    }
    resetting = true;
    if (timerInterval) clearInterval(timerInterval);
    try { localStorage.removeItem(KEY); localStorage.removeItem(PHOTO_KEY); } catch(e) {}
    P = { student: null, elapsed: 0, lastTick: null, reported: false, fill: {} };
    FOTO = '';
    resetting = false;
    o.remove();
    showModal();
  };
}

// ====== INIT ======
if (!P.student) showModal(); else showResumeModal();
</script>
</body>
</html>
