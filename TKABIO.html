<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belajar TKA Biologi</title>
<style>
:root{--navy:#1c4f82;--blue:#0d6efd;--grn:#198754;--red:#dc3545;--line:#dfe3e8;--fs:16px}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,"Segoe UI",system-ui,sans-serif;background:#f3f6fa;color:#1f2a37;font-size:var(--fs);line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(90deg,#16406c,#2a6097);color:#fff;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}
header h1{margin:0;font-size:1.2em}
header small{opacity:.8}
main{max-width:880px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.tc b{display:block}
.tc small{color:#667}
.dots{margin-top:8px;display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e5e7eb}
.dots i.ok{background:var(--grn)}
.dots i.no{background:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h2{margin:0 0 8px;font-size:1.05em;color:var(--navy)}
.back{background:none;color:var(--navy);font-weight:600;padding:6px 0}
.step{display:flex;gap:10px;padding:8px 0;animation:f .3s}
.step span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.8em}
@keyframes f{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.step{animation:none}}
.btn{padding:10px 18px;border-radius:22px;background:var(--navy);color:#fff;font-weight:600;min-height:44px}
.btn.g{background:var(--grn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.opt{display:flex;gap:12px;align-items:flex-start;padding:8px 6px;border-radius:10px;cursor:pointer}
.opt:hover{background:#f4f8fd}
.opt input{flex:none;width:22px;height:22px;margin-top:3px;accent-color:var(--blue)}
.opt.ok{background:#e4f6ea}
.opt.bad{background:#fde8ea}
.c p{margin:0 0 .6em}
.c table:not(.kat){display:block;overflow-x:auto;max-width:100%}
.c td,.c th{font-size:.92em}
@media(max-width:640px){.c table:not(.kat) td,.c table:not(.kat) th{padding:4px 5px;font-size:.82em}}
.c svg{color:#222;max-width:100%;height:auto}
.c table{border-collapse:collapse;max-width:100%;margin:8px 0}
.c td,.c th{border:1px solid #b8bec6;padding:5px 8px}
.c th{background:#f1f4f8}
.kat{width:100%}
.kat th{background:#f1f4f8}
.kat td.ck{text-align:center;width:80px}
.kat td.ok{background:#e4f6ea}
.kat td.bad{background:#fde8ea}
.kat input{width:24px;height:24px;accent-color:var(--blue)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.92em}
.fb.ok{background:#e4f6ea}
.fb.bad{background:#fde8ea}
.fs{float:right;font-size:.8em}
.fs button{background:none;padding:2px 6px}
@media(max-width:640px){
  .kat thead{display:none}
  .kat,.kat tbody,.kat tr{display:block;width:100%}
  .kat tr{border:1px solid #dfe3e8;border-radius:10px;margin:10px 0;padding:8px 10px}
  .kat td{display:block;border:0!important;padding:2px 0!important}
  .kat td:first-child{font-weight:700;padding-bottom:0!important}
  .kat td.ck{display:inline-flex;width:auto;gap:8px;align-items:center;margin:6px 16px 0 0}
  .kat td.ck::after{content:attr(data-l)}
}
@media(min-width:1400px){:root{--fs:19px}main{max-width:1000px}}

/* Modal popup */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-box{background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{margin:0 0 8px;color:var(--navy);font-size:1.15em}
.modal-box p{margin:0 0 14px;font-size:.92em;color:#444}
.modal-box label{display:block;font-weight:600;font-size:.9em;margin:10px 0 4px}
.modal-box input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:.95em}
.modal-box input:focus{outline:2px solid var(--blue);border-color:transparent}
.modal-box .err{color:var(--red);font-size:.82em;margin-top:6px;display:none}
.modal-box button{margin-top:16px;width:100%}

/* Timer bar */
.timer-bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:12px;font-size:.9em;flex-wrap:wrap}
.timer-bar .t-val{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.timer-bar .t-ok{color:var(--grn)}
.timer-bar .t-warn{color:#c97a00}
.badge{background:#eaf2fb;color:var(--navy);border-radius:20px;padding:2px 10px;font-size:.82em;font-weight:600}
.badge.warn{background:#fff3cd;color:#8a6d00}
.badge.ok{background:#e4f6ea;color:var(--grn)}

/* Ringkasan */
.summary-box{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.summary-box h3{margin:0 0 10px;font-size:1em;color:var(--navy)}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:.92em}
.summary-row:last-child{border-bottom:0}
.summary-row span:first-child{color:#555}
.summary-row span:last-child{font-weight:600;text-align:right}
.send-status{margin-top:10px;font-size:.88em;padding:8px 10px;border-radius:8px;display:none}
.send-status.ok{background:#e4f6ea;color:var(--grn);display:block}
.send-status.err{background:#fde8ea;color:var(--red);display:block}
.send-status.info{background:#eaf2fb;color:var(--navy);display:block}

/* Foto catatan */
.ph-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.ph-wrap{grid-template-columns:1fr}}
.ph-slot{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:8px}
.ph-title{font-weight:600;font-size:.88em;color:var(--navy);min-height:2.6em}
.ph-box{border:2px dashed #cbd5e1;border-radius:12px;background:#fafcff;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.ph-box img{width:100%;height:100%;object-fit:contain;background:#000}
.ph-slot.has .ph-box{border-style:solid;border-color:var(--grn)}
.ph-empty{color:#889;font-size:.85em;text-align:center;padding:8px}
.ph-btns{display:flex;gap:6px}
.ph-btns .btn{flex:1;padding:8px 6px;font-size:.85em;text-align:center;cursor:pointer;display:grid;place-items:center}
.btn.alt{background:#eaf2fb;color:var(--navy)}
.ph-msg{font-size:.8em;min-height:1.2em;color:#667}
.ph-msg.err{color:var(--red)}
.ph-msg.ok{color:var(--grn)}
</style>
</head>
<body>
<header><h1>Belajar TKA Biologi</h1><small>Baca materi → ikuti strategi → jawab soal</small></header>
<main id="app"></main>

<script>
const TOPICS=[{"judul":"Klasifikasi & Keanekaragaman Hayati","elemen":"Keanekaragaman Hayati","materi":"<p>Klasifikasi mengelompokkan makhluk hidup berdasarkan <b>kesamaan dan perbedaan ciri<\/b>. Ciri <b>homolog<\/b> (asal/struktur sama) menunjukkan kekerabatan, sedangkan ciri <b>analog<\/b> (fungsi sama, asal berbeda) tidak, misalnya sayap kelelawar dan burung.<\/p><p>Takson: domain → kingdom → filum → kelas → ordo → famili → genus → spesies. Nama ilmiah memakai <b>binomial<\/b>: genus + spesies. Keanekaragaman hayati ada di tingkat <b>gen, jenis, dan ekosistem<\/b>. Di Indonesia, Garis Wallace dan Weber membagi fauna menjadi tipe Asiatis (barat), Peralihan/Wallacea (tengah), dan Australis (timur).<\/p>","scaf":["Tandai ciri-ciri yang disebut di soal.","Pisahkan ciri berdasarkan struktur/asal (homolog) dari ciri yang hanya serupa fungsinya (analog).","Pilih dasar pengelompokan yang memakai struktur/asal, bukan sekadar fungsi, habitat, atau ukuran."],"soal":[{"no":1,"stim":"<p>Kelelawar dan burung sama-sama memiliki sayap untuk terbang. Namun, kelelawar memiliki rambut dan menyusui anaknya, sedangkan burung berbulu dan bertelur.<\/p>","q":"<p>Dasar pengelompokan yang tepat untuk menempatkan kelelawar ke dalam kelas Mammalia adalah ....<\/p>","t":"pg","opts":["<p>kesamaan fungsi sayap untuk terbang<\/p>","<p>ciri kelenjar susu dan rambut, sedangkan sayap keduanya hanya hasil adaptasi yang serupa<\/p>","<p>kesamaan habitat di udara<\/p>","<p>kesamaan waktu aktif pada malam hari<\/p>","<p>ukuran tubuh yang relatif kecil<\/p>"],"key":["B"]},{"no":1,"stim":"<p>Tanaman A berakar serabut, tulang daun sejajar, dan berbiji satu keping (padi). Tanaman B berakar tunggang, tulang daun menjari, dan berbiji dua keping (kacang tanah).<\/p>","q":"<p>Pengelompokan kedua tanaman tersebut yang tepat adalah ....<\/p>","t":"pg","opts":["<p>A termasuk dikotil dan B monokotil karena ukuran biji<\/p>","<p>A monokotil dan B dikotil berdasarkan jumlah keping biji, tipe akar, dan tulang daun<\/p>","<p>keduanya monokotil karena sama-sama berbunga<\/p>","<p>keduanya dikotil karena sama-sama berbiji<\/p>","<p>A dan B tidak dapat dikelompokkan karena habitatnya berbeda<\/p>"],"key":["B"]},{"no":1,"stim":"<p>Harimau sumatra (<i>Panthera tigris sumatrae<\/i>) dan macan tutul (<i>Panthera pardus<\/i>) sama-sama hidup di Indonesia.<\/p>","q":"<p>Berdasarkan tata nama keduanya, kesimpulan yang tepat adalah ....<\/p>","t":"pg","opts":["<p>keduanya satu genus tetapi spesies berbeda<\/p>","<p>keduanya satu spesies tetapi genus berbeda<\/p>","<p>keduanya berbeda genus dan spesies<\/p>","<p>keduanya satu genus dan satu spesies<\/p>","<p>keduanya satu famili tetapi berbeda kelas<\/p>"],"key":["A"]}]},{"judul":"Struktur & Peranan Bakteri","elemen":"Keanekaragaman Hayati (Bakteri)","materi":"<p>Bakteri adalah <b>prokariot<\/b> (tanpa membran inti). <b>Gram-positif<\/b>: peptidoglikan tebal, tampak ungu. <b>Gram-negatif<\/b>: peptidoglikan tipis dan ada membran luar (LPS), tampak merah karena kristal violet luntur oleh alkohol.<\/p><p><b>Resistensi antibiotik<\/b> muncul karena seleksi (bakteri resisten bertahan) dan perpindahan gen: konjugasi, transformasi, transduksi. <b>Peran<\/b>: <i>Rhizobium<\/i> (fiksasi N₂), <i>Nitrosomonas<\/i> (NH₃→NO₂⁻), <i>Nitrobacter<\/i> (NO₂⁻→NO₃⁻), <i>Lactobacillus<\/i> (yoghurt), <i>E. coli<\/i> (vitamin K di usus).<\/p>","scaf":["Tentukan dulu konsepnya: struktur, peran, atau resistensi.","Nilai setiap pernyataan satu per satu, jangan dibandingkan antaropsi.","Waspadai pernyataan yang menukar peran bakteri atau menyebut bakteri 'sengaja' berubah."],"soal":[{"no":2,"stim":"<p>Di rumah sakit ditemukan bakteri yang resisten terhadap beberapa jenis antibiotik.<\/p>","q":"<p>Manakah pernyataan yang tepat tentang resistensi bakteri terhadap antibiotik?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p>Gen resistensi pada plasmid dapat berpindah antarbakteri melalui konjugasi.<\/p>","<p>Penggunaan antibiotik yang tidak tuntas dapat menyeleksi bakteri yang resisten.<\/p>","<p>Bakteri sengaja berubah menjadi resisten setelah terkena antibiotik.<\/p>","<p>Antibiotik efektif untuk mengobati penyakit akibat virus.<\/p>","<p>Membran luar pada bakteri Gram-negatif membatasi masuknya sebagian antibiotik.<\/p>"],"key":["A","B","E"]},{"no":2,"stim":"<p>Bakteri berperan penting bagi kehidupan manusia dan lingkungan.<\/p>","q":"<p>Manakah pernyataan yang benar tentang peranan bakteri?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p><i>Rhizobium<\/i> bersimbiosis dengan akar polong dan memfiksasi nitrogen.<\/p>","<p><i>Nitrosomonas<\/i> mengubah nitrit menjadi nitrat.<\/p>","<p><i>Lactobacillus<\/i> mengubah laktosa susu menjadi asam laktat pada pembuatan yoghurt.<\/p>","<p><i>Escherichia coli<\/i> di usus besar membantu menghasilkan vitamin K.<\/p>","<p>Bakteri Gram-positif memiliki membran luar yang tebal.<\/p>"],"key":["A","C","D"]},{"no":2,"stim":"<p>Pewarnaan Gram digunakan untuk membedakan dua kelompok bakteri.<\/p>","q":"<p>Manakah pernyataan yang benar tentang pewarnaan Gram?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p>Bakteri Gram-positif tampak ungu karena peptidoglikan tebal menahan kristal violet.<\/p>","<p>Bakteri Gram-negatif tampak merah karena peptidoglikan tipis dan kristal violet luntur saat alkohol.<\/p>","<p>Safranin digunakan sebagai pewarna utama.<\/p>","<p>Bakteri Gram-negatif umumnya memiliki membran luar yang mengandung LPS.<\/p>","<p>Pewarnaan Gram membedakan bakteri berdasarkan ada tidaknya inti sel.<\/p>"],"key":["A","B","D"]}]},{"judul":"Ekosistem & Aliran Energi","elemen":"Ekosistem","materi":"<p>Ekosistem terdiri atas komponen biotik dan abiotik. Urutan trofik: <b>produsen → konsumen I → II → III<\/b>, dan pengurai. Aliran energi <b>searah<\/b> dan hanya sekitar 10% yang berpindah ke tingkat berikutnya.<\/p><p>Pada jaring-jaring makanan, <b>panah menunjuk ke pemakan<\/b>. Perubahan satu populasi menimbulkan <b>efek berantai<\/b>: predator berkurang → mangsa cenderung bertambah. Interaksi lain: kompetisi, predasi, dan simbiosis.<\/p>","scaf":["Cari produsen: organisme yang hanya punya panah keluar.","Hitung tingkat trofik dari produsen; organisme bisa memiliki lebih dari satu tingkat.","Telusuri dampak mengikuti arah panah, lalu tanyakan siapa pemangsa dan siapa mangsanya."],"soal":[{"no":3,"stim":"<p>Perhatikan jaring-jaring makanan pada ekosistem sawah berikut.<\/p><div style=\"margin:8px 0\"><svg viewBox=\"0 0 460 230\" style=\"max-width:100%;width:460px;height:auto;font:11px sans-serif\" role=\"img\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0L8,4L0,8z\" fill=\"#555\"/><\/marker><\/defs><line x1=\"60.0\" y1=\"175.0\" x2=\"60.0\" y2=\"125.0\" stroke=\"#555\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"83.8\" y1=\"190.0\" x2=\"163.0\" y2=\"190.0\" stroke=\"#555\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"96.6\" y1=\"110.0\" x2=\"163.0\" y2=\"110.0\" stroke=\"#555\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"216.9\" y1=\"182.3\" x2=\"306.3\" y2=\"156.8\" stroke=\"#555\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"216.9\" y1=\"117.7\" x2=\"306.3\" y2=\"143.2\" stroke=\"#555\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"341.2\" y1=\"135.6\" x2=\"388.8\" y2=\"74.4\" stroke=\"#555\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"211.9\" y1=\"176.4\" x2=\"378.1\" y2=\"73.6\" stroke=\"#555\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"39.2\" y=\"178\" width=\"41.6\" height=\"24\" rx=\"6\" fill=\"#eaf2fb\" stroke=\"#1c4f82\"/><text x=\"60\" y=\"194\" text-anchor=\"middle\" fill=\"#123\">Padi<\/text><rect x=\"26.4\" y=\"98\" width=\"67.2\" height=\"24\" rx=\"6\" fill=\"#eaf2fb\" stroke=\"#1c4f82\"/><text x=\"60\" y=\"114\" text-anchor=\"middle\" fill= ukan<\/th><\/tr><tr><td>Hemoglobin (g/dL)<\/td><td>8,5<\/td><td>12 – 16<\/td><\/tr><tr><td>Leukosit (sel/µL)<\/td><td>7.000<\/td><td>4.000 – 11.000<\/td><\/tr><tr><td>Trombosit (sel/µL)<\/td><td>90.000<\/td><td>150.000 – 400.000<\/td><\/tr><\/table>","q":"<p>Berdasarkan hasil pemeriksaan tersebut, tentukan kebenaran pernyataan berikut!<\/p><p>Tentukan Benar atau Salah untuk setiap pernyataan berikut!<\/p>","t":"kat","heads":["Benar","Salah"],"rows":["<p>Pasien kemungkinan mengalami anemia.<\/p>","<p>Jumlah leukosit menunjukkan pasien mengalami infeksi berat.<\/p>","<p>Pasien berisiko mengalami gangguan pembekuan darah.<\/p>"],"key":[0,1,0]},{"no":5,"stim":"<p>Data denyut jantung dan volume darah yang dipompa tiap denyut (volume sekuncup) seseorang.<\/p><table><tr><th>Kondisi<\/th><th>Denyut (kali/menit)<\/th><th>Volume sekuncup (mL)<\/th><\/tr><tr><td>Istirahat<\/td><td>70<\/td><td>70<\/td><\/tr><tr><td>Berolahraga<\/td><td>150<\/td><td>100<\/td><\/tr><\/table>","q":"<p>Berdasarkan data tersebut, tentukan kebenaran pernyataan berikut!<\/p><p>Tentukan Benar atau Salah untuk setiap pernyataan berikut!<\/p>","t":"kat","heads":["Benar","Salah"],"rows":["<p>Peningkatan curah jantung hanya disebabkan naiknya denyut, volume sekuncup tetap.<\/p>","<p>Curah jantung saat berolahraga lebih besar daripada saat istirahat.<\/p>","<p>Peningkatan curah jantung membantu memenuhi kebutuhan O₂ otot yang meningkat.<\/p>"],"key":[1,0,0]},{"no":5,"stim":"<p>Tabel berikut menunjukkan antigen dan antibodi plasma pada golongan darah sistem ABO.<\/p><table><tr><th>Golongan<\/th><th>Antigen (eritrosit)<\/th><th>Antibodi (plasma)<\/th><\/tr><tr><td>A<\/td><td>A<\/td><td>anti-B<\/td><\/tr><tr><td>B<\/td><td>B<\/td><td>anti-A<\/td><\/tr><tr><td>AB<\/td><td>A dan B<\/td><td>tidak ada<\/td><\/tr><tr><td>O<\/td><td>tidak ada<\/td><td>anti-A dan anti-B<\/td><\/tr><\/table>","q":"<p>Berdasarkan tabel tersebut, tentukan kebenaran pernyataan berikut!<\/p><p>Tentukan Benar atau Salah untuk setiap pernyataan berikut!<\/p>","t":"kat","heads":["Benar","Salah"],"rows":["<p>Penderita golongan darah B dapat menerima darah golongan A.<\/p>","<p>Penderita golongan darah A dapat menerima darah golongan O.<\/p>","<p>Orang bergolongan AB tidak memiliki antibodi anti-A maupun anti-B.<\/p>"],"key":[1,0,0]}]},{"judul":"Sistem Respirasi","elemen":"Proses pada Makhluk Hidup","materi":"<p>Ventilasi dilakukan oleh diafragma dan otot antartulang rusuk. Pertukaran gas terjadi di <b>alveolus<\/b> secara difusi, dan efisien karena luas permukaannya besar, dindingnya tipis, dan lembap.<\/p><p>Sebagian besar CO₂ (±70%) diangkut sebagai <b>ion bikarbonat (HCO₃⁻)<\/b>. Pusat pernapasan di <b>medula oblongata<\/b> dipicu kemoreseptor yang peka terhadap CO₂/pH dan O₂ darah. Emfisema merusak alveolus sehingga luas permukaan difusi berkurang.<\/p>","scaf":["Temukan bagian atau kondisi yang terganggu pada soal.","Tanyakan: apa fungsi bagian itu?","Tarik dampak langsung pada pertukaran gas atau pengaturan napas."],"soal":[{"no":6,"stim":"<p>Pendaki yang berada di dataran tinggi sering bernapas lebih cepat karena tekanan oksigen di udara lebih rendah.<\/p>","q":"<p>Mekanisme yang menyebabkan peningkatan frekuensi napas tersebut adalah ....<\/p>","t":"pg","opts":["<p>kemoreseptor mendeteksi penurunan kadar O₂ darah lalu pusat pernapasan di medula oblongata meningkatkan frekuensi napas<\/p>","<p>diafragma berhenti berkontraksi sehingga paru-paru tidak mengembang<\/p>","<p>alveolus bertambah jumlahnya dalam hitungan menit<\/p>","<p>hemoglobin melepaskan seluruh O₂ di paru-paru<\/p>","<p>otot jantung berhenti berkontraksi sesaat<\/p>"],"key":["A"]},{"no":6,"stim":"<p>Pada penderita emfisema, dinding alveolus rusak dan menyatu sehingga jumlah alveolus berkurang.<\/p>","q":"<p>Dampak langsung kondisi tersebut terhadap pernapasan adalah ....<\/p>","t":"pg","opts":["<p>luas permukaan untuk difusi gas berkurang sehingga pertukaran O₂ dan CO₂ menurun<\/p>","<p>otot diafragma tidak dapat berkontraksi<\/p>","<p>darah kehilangan hemoglobin<\/p>","<p>trakea menyempit secara permanen<\/p>","<p>tekanan udara di luar tubuh meningkat<\/p>"],"key":["A"]},{"no":6,"stim":"<p>Di jaringan yang aktif bermetabolisme, CO₂ masuk ke dalam darah.<\/p>","q":"<p>Bentuk pengangkutan CO₂ terbanyak dalam darah adalah ....<\/p>","t":"pg","opts":["<p>ion bikarbonat (HCO₃⁻) dalam plasma<\/p>","<p>gas CO₂ bebas terlarut dalam plasma<\/p>","<p>karbaminohemoglobin<\/p>","<p>karboksihemoglobin<\/p>","<p>asam karbonat pekat dalam trombosit<\/p>"],"key":["A"]}]},{"judul":"Sistem Ekskresi","elemen":"Proses pada Makhluk Hidup","materi":"<p>Ginjal membentuk urin melalui <b>filtrasi<\/b> (glomerulus, menghasilkan urin primer tanpa protein besar), <b>reabsorpsi<\/b> (tubulus proksimal: glukosa, asam amino), dan <b>augmentasi<\/b> (tubulus distal/duktus koligen). ADH meningkatkan reabsorpsi air.<\/p><p>Organ ekskresi lain: paru-paru (CO₂, uap air), kulit (keringat), hati (membentuk urea dan empedu). Protein atau glukosa dalam urin menandakan gangguan filtrasi atau reabsorpsi.<\/p>","scaf":["Tentukan organ atau tahap yang dibahas.","Ingat tempat dan hasil tahap itu.","Periksa kata mutlak seperti 'pasti' atau 'selalu' yang sering membuat pernyataan salah."],"soal":[{"no":7,"stim":"<p>Ginjal membentuk urin melalui tiga tahap: filtrasi, reabsorpsi, dan augmentasi.<\/p>","q":"<p>Manakah pernyataan yang benar tentang pembentukan urin?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p>Filtrasi di glomerulus menghasilkan urin primer yang tidak mengandung protein berukuran besar.<\/p>","<p>Glukosa direabsorpsi di tubulus kontortus proksimal.<\/p>","<p>Augmentasi terjadi di glomerulus.<\/p>","<p>ADH meningkatkan permeabilitas tubulus distal dan duktus koligen terhadap air.<\/p>","<p>Urin sekunder orang sehat mengandung glukosa dalam jumlah tinggi.<\/p>"],"key":["A","B","D"]},{"no":7,"stim":"<p>Tubuh membuang zat sisa metabolisme melalui beberapa organ ekskresi.<\/p>","q":"<p>Manakah pernyataan yang benar?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p>Paru-paru mengeluarkan CO₂ dan uap air.<\/p>","<p>Keringat mengandung air, garam mineral, dan sedikit urea.<\/p>","<p>Hati membentuk urea dari amonia hasil deaminasi asam amino.<\/p>","<p>Kulit menghasilkan empedu.<\/p>","<p>Urea dibentuk di dalam ginjal.<\/p>"],"key":["A","B","C"]},{"no":7,"stim":"<p>Hasil analisis urin seorang pasien: protein positif (+++), glukosa negatif.<\/p>","q":"<p>Manakah pernyataan yang benar?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p>Kebocoran protein ke urin dapat terjadi bila membran filtrasi glomerulus rusak.<\/p>","<p>Pasien pasti menderita diabetes melitus karena ada protein dalam urin.<\/p>","<p>Pada urin normal, protein tidak ditemukan.<\/p>","<p>Glukosa negatif menunjukkan reabsorpsi glukosa di tubulus proksimal berjalan normal.<\/p>","<p>Urin primer normal mengandung banyak protein.<\/p>"],"key":["A","C","D"]}]},{"judul":"Sistem Imun","elemen":"Proses pada Makhluk Hidup","materi":"<p>Pertahanan <b>nonspesifik<\/b>: kulit, fagosit, inflamasi. Pertahanan <b>spesifik<\/b>: limfosit B (antibodi, humoral) serta sel T helper dan T sitotoksik (seluler). Paparan pertama membentuk <b>sel memori<\/b>, sehingga respons sekunder lebih cepat dan lebih kuat.<\/p><p>Imunitas <b>aktif<\/b> dibentuk tubuh sendiri (infeksi/vaksin); <b>pasif<\/b> diperoleh dari antibodi jadi. Alergi: alergen memicu IgE pada sel mast, lalu histamin dilepas.<\/p>","scaf":["Tentukan jenis imunitas atau respons yang dibahas.","Jika ada grafik, bandingkan kecepatan dan ketinggian respons pertama dan kedua.","Cocokkan setiap pernyataan dengan peran sel atau molekul yang tepat."],"soal":[{"no":8,"stim":"<p>Seorang anak diberi vaksin campak, lalu beberapa bulan kemudian mendapat dosis penguat (<i>booster<\/i>).<\/p>","q":"<p>Manakah pernyataan yang benar mengenai vaksinasi tersebut?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p>Vaksin merangsang pembentukan sel memori.<\/p>","<p>Vaksin menghasilkan kekebalan aktif buatan.<\/p>","<p>Vaksin berisi antibodi siap pakai.<\/p>","<p>Dosis penguat memicu respons sekunder yang lebih cepat dan kuat.<\/p>","<p>Kekebalan dari vaksin bersifat pasif.<\/p>"],"key":["A","B","D"]},{"no":8,"stim":"<p>Seorang anak bersin dan gatal setelah terpapar debu.<\/p>","q":"<p>Manakah pernyataan yang benar tentang reaksi alergi?<\/p><p>Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.<\/p>","t":"mc","opts":["<p>Alergen memicu pembentukan IgE yang menempel pada sel mast.<\/p>","<p>Histamin menyebabkan pelebaran pembuluh darah dan rasa gatal.<\/p>","<p>Alergi adalah respons tubuh terhadap patogen yang berbahaya.<\/p>","<p>Antihistamin bekerja menghambat kerja histamin.<\/p>","<p>Alergi menular melalui kontak langsung.<\/p>"],"key":["A","B","D"]},{"no":8,"stim":"<p>Grafik berikut menunjukkan kadar antibodi seorang anak setelah terpapar antigen yang sama pada hari ke-0 dan hari ke-35.<\/p><div style=\"margin:8px 0\"><svg viewBox=\"0 0 440 250\" style=\"max-width:100%;width:440px;height:auto;font:11px sans-serif\" role=\"img\"><text x=\"220.0\" y=\"16\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"currentColor\">Kadar antibodi terhadap antigen<\/text><line x1=\"48\" y1=\"204.0\" x2=\"424\" y2=\"204.0\" stroke=\"#ccc\"/><text x=\"42\" y=\"208.0\" text-anchor=\"end\" fill=\"currentColor\">0<\/text><line x1=\"48\" y1=\"160.0\" x2=\"424\" y2=\"160.0\" stroke=\"#ccc\"/><text x=\"42\" y=\"164.0\" text-anchor=\"end\" fill=\"currentColor\">3<\/text><line x1=\"48\" y1=\"116.0\" x2=\"424\" y2=\"116.0\" stroke=\"#ccc\"/><text x=\"42\" y=\"120.0\" text-anchor=\"end\" fill=\"currentColor\">6<\/text><line x1=\"48\" y1=\"72.0\" x2=\"424\" y2=\"72.0\" stroke=\"#ccc\"/><text x=\"42\" y=\"76.0\" text-anchor=\"end\" fill=\"currentColor\">9<\/text><line x1=\"48\" y1=\"28\" x2=\"424     // Tab tidak aktif
    isTabActive = false;
    if (P.lastTick) {
      // simpan sisa waktu tepat sebelum tab ditutup
      P.elapsed += Math.floor((Date.now() - P.lastTick) / 1000);
      save();
    }
  }
});

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  updateTimerUI();
  timerInterval = setInterval(() => {
    if (document.visibilityState === "visible") {
      if (!P.lastTick) P.lastTick = Date.now();
      const now = Date.now();
      // Hanya tambah jika selisih wajar (< 2 detik) untuk mencegah kebocoran waktu
      const selisih = Math.floor((now - P.lastTick) / 1000);
      if (selisih > 0 && selisih < 2) {
        P.elapsed += selisih;
        P.lastTick = now;
        save();
        updateTimerUI();
        
        refreshSendUI();
      } else {
        // Jika selisih > 2 detik, itu berarti browser di-pause, jangan tambahkan waktu
        P.lastTick = now;
      }
    }
  }, 1000);
}

function updateTimerUI() {
  const el = $('timer-display');
  if (!el) return;
  el.textContent = formatTime(P.elapsed);
  const cukup = P.elapsed >= MIN_DETIK;
  el.className = 't-val ' + (cukup ? 't-ok' : 't-warn');
  const badge = $('timer-badge');
  if (badge) {
    badge.className = 'badge ' + (cukup ? 'ok' : 'warn');
    badge.textContent = cukup ? '✅ Waktu cukup' : '⏳ Belum 10 menit';
  }
}

// ====== FOTO ======
function compressImage(file, max = 1280, q = 0.7) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('File bukan gambar yang bisa dibaca')); };
    img.src = url;
  });
}

function slotHTML(i) {
  const has = !!PH[i];
  return `<div class="ph-slot ${has ? 'has' : ''}" data-slot="${i}">
    <div class="ph-title">Topik ${i + 1}: ${TOPICS[i].judul}</div>
    <div class="ph-box">${has ? `<img src="${PH[i]}" alt="Foto catatan topik ${i + 1}">` : '<div class="ph-empty">📓 Belum ada foto<br>catatan topik ini</div>'}</div>
    <div class="ph-btns">
      <label class="btn">📷 ${has ? 'Foto ulang' : 'Kamera'}<input type="file" accept="image/*" capture="environment" hidden data-ph="${i}"></label>
      <label class="btn alt">🖼️ Galeri<input type="file" accept="image/*" hidden data-ph="${i}"></label>
    </div>
    <div class="ph-msg ${has ? 'ok' : ''}">${has ? '✅ Foto siap dikirim' : ''}</div>
  </div>`;
}

function bindPhotoSlots(root) {
  root.querySelectorAll('input[data-ph]').forEach(inp => {
    inp.onchange = async () => {
      const i = +inp.dataset.ph;
      const file = inp.files && inp.files[0];
      if (!file) return;
      const slot = root.querySelector(`.ph-slot[data-slot="${i}"]`);
      const msg = slot.querySelector('.ph-msg');
      msg.className = 'ph-msg'; msg.textContent = '⏳ Memproses foto...';
      try {
        PH[i] = await compressImage(file);
        savePH();
        slot.outerHTML = slotHTML(i);
        bindPhotoSlots(root);
        refreshSendUI();
      } catch (err) {
        msg.className = 'ph-msg err';
        msg.textContent = '❌ ' + err.message;
      }
    };
  });
}

function photoCount() { return PHOTO_TOPICS.filter(i => PH[i]).length; }

// ====== STATUS TOMBOL KIRIM ======
function sendState() {
  if (P.reported) return { ok: false, label: '✅ Anda sudah berhasil mengirimkan laporan' };
  const timeOk = P.elapsed >= MIN_DETIK;
  const miss = PHOTO_TOPICS.length - photoCount();
  if (miss > 0) return { ok: false, label: `📷 Lengkapi ${miss} foto catatan dulu` };
  if (!timeOk) return { ok: false, label: `🔒 Kirim Laporan (${formatTime(MIN_DETIK - P.elapsed)} lagi)` };
  return { ok: true, label: P.reported ? '📤 Kirim Ulang Laporan' : '📤 Kirim Laporan ke Google Sheets' };
}

function refreshSendUI() {
  const st = sendState();
  const btn = $('btn-send');
  if (btn && !sending) { btn.disabled = !st.ok; btn.textContent = st.label; }
  const t = $('summary-time'); if (t) t.textContent = formatTime(P.elapsed);
  const ft = $('summary-foto'); if (ft) ft.textContent = `${photoCount()}/${PHOTO_TOPICS.length} foto`;
  const ss = $('summary-status');
  if (ss) ss.textContent = P.elapsed >= MIN_DETIK ? '✅ Mencapai 15 menit' : '⏳ Belum mencapai 15 menit';
}

    <div class="timer-bar">

    </div>
    <p>Halo <b>${P.student.nama}</b> (${P.student.kelas}) ✅ Pelajari topik 4–6, catat materi ringkasnya di buku tulis, kerjakan soal latihan, lalu <b>foto hasil tulisanmu</b> dan kirimkan.</p>
    <p>Terjawab benar: <b>${done}/${TOPICS.length * 3}</b> &nbsp;|&nbsp; Jawaban salah: <b>${wrong}</b></p>

      return `<button class="tc" data-i="${i}"><b>${i+1}. ${t.judul}</b><small>${t.elemen}</small><div class="dots">${dots}</div></button>`;
    }).join('') + `</div>
    <div class="card">
      <h2>📸 Foto Catatan Materi (topik 4–6)</h2>
      <p style="margin:0 0 10px;font-size:.9em;color:#555">Tulis ringkasan materi tiap topik di buku tulis, lalu foto hasilnya. Pastikan tulisan terbaca jelas dan cahayanya cukup. Satu foto untuk satu topik.</p>
      <div class="ph-wrap">${PHOTO_TOPICS.map(slotHTML).join('')}</div>
    </div>
    <div class="summary-box">
      <h3>📊 Ringkasan Belajar</h3>
      <div class="summary-row"><span>Nama</span><span>${P.student.nama}</span></div>
      <div class="summary-row"><span>Kelas</span><span>${P.student.kelas}</span></div>
      <div class="summary-row"><span>Waktu belajar</span><span id="summary-time">${formatTime(P.elapsed)}</span></div>
      <div class="summary-row"><span>Jumlah jawaban salah</span><span>${wrong}</span></div>
      <div class="summary-row"><span>Foto catatan</span><span id="summary-foto">${photoCount()}/${PHOTO_TOPICS.length} foto</span></div>

    </div>`;

  $('btn-send').onclick = sendReport;
  if (P.reported) {
    const ss = $('send-status');
    ss.className = 'send-status ok';
    ss.textContent = '✅ Laporan Anda sudah diterima guru. Tidak perlu mengirim ulang.';

// ====== TOPIC ======
function qhtml(q, ti, qi) {
  const nm = `q${qi}`;
  let h = `<div class="c">${q.stim}${q.q}</div>`;
  if (q.t === 'kat') {
    h += `<table class="kat c"><thead><tr><th>#</th><th></th>${q.heads.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>` +
      q.rows.map((r, i) =>
        `<tr><td>${L[i]}.</td><td>${r}</td>` +
        q.heads.map((_, j) => `<td class="ck" data-l="${q.heads[j].replace(/<[^>]+>/g,'')}" data-r="${i}" data-c="${j}"><input type="radio" name="${nm}r${i}" data-r="${i}" data-c="${j}" aria-label="${L[i]} ${q.heads[j]}"></td>`).join('') +
        '</tr>'
      ).join('') + '</tbody></table>';
  } else {
    h += q.opts.map((o, i) =>
      `<label class="opt" data-o="${L[i]}"><input type="${q.t === 'mc' ? 'checkbox' : 'radio'}" name="${nm}" value="${L[i]}"><div class="c">${o}</div></label>`
    ).join('');
  }
  return h;
}

function topic(i) {
  const t = TOPICS[i];
  app.innerHTML = `
    <button class="back" id="bk">← Semua topik</button>
    <h2 style="margin:6px 0">${i+1}. ${t.judul}</h2>
    <small>Elemen: ${t.elemen}</small>
    <div class="card">
      <h2>1. Materi ringkas <span class="fs">Font: <button data-f="15">A</button><button data-f="17">A</button><button data-f="20">A</button></span></h2>
      <div class="c">${t.materi}</div>
    </div>
    <div class="card">
      <h2>2. Strategi menjawab (langkah demi langkah)</h2>
      <div id="st"></div>
      <button class="btn" id="nx">Tampilkan langkah 1</button>
    </div>
    <h2 style="margin:18px 0 0;color:#1c4f82">3. Latihan soal</h2>` +
    t.soal.map((q, qi) =>
      `<div class="card" id="c${qi}"><h2>Soal ${qi+1}</h2>${qhtml(q, i, qi)}<button class="btn g" data-k="${qi}" style="margin-top:12px">Periksa jawaban</button><div id="f${qi}"></div></div>`
    ).join('') +
    (PHOTO_TOPICS.includes(i) ? `<div class="card"><h2>4. Foto catatan materi</h2><p style="margin:0 0 10px;font-size:.9em;color:#555">Foto tulisan ringkasan materi topik ini dari buku tulismu. Foto bisa diunggah juga dari halaman utama.</p>${slotHTML(i)}</div>` : '') +
    `<button class="back" id="bk2">← Kembali ke daftar topik</button>`;

  $('bk').onclick = $('bk2').onclick = renderHome;
  bindPhotoSlots(app);
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => document.documentElement.style.setProperty('--fs', b.dataset.f + 'px'));

  let s = 0;
  $('nx').onclick = () => {
    $('st').insertAdjacentHTML('beforeend', `<div class="step"><span>${s+1}</span><div>${t.scaf[s]}</div></div>`);
    s++;
    $('nx').textContent = s < t.scaf.length ? `Tampilkan langkah ${s+1}` : 'Semua langkah sudah tampil';
    $('nx').disabled = s >= t.scaf.length;
  };
  $('nx').click();

  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => check(i, +b.dataset.k));
  scrollTo(0, 0);
}

// ====== CHECK ======
function check(ti, qi) {
  const q = TOPICS[ti].soal[qi];
  const c = $('c' + qi);
  let ok, got;

  if (q.t === 'kat') {
    got = q.rows.map((_, r) => {
      const x = c.querySelector(`input[data-r="${r}"]:checked`);
      return x ? +x.dataset.c : null;
    });
    ok = got.every((g, r) => g === q.key[r]);
    c.querySelectorAll('td.ck').forEach(td => {
      const r = +td.dataset.r, j = +td.dataset.c;
      td.classList.remove('ok', 'bad');
      if (q.key[r] === j) td.classList.add('ok');
      else if (got[r] === j) td.classList.add('bad');
    });
  } else {
    got = [...c.querySelectorAll('input:checked')].map(x => x.value).sort();
    ok = got.join() === [...q.key].sort().join();
    c.querySelectorAll('.opt').forEach(o => {
      o.classList.remove('ok', 'bad');
      const k = o.dataset.o;
      if (q.key.includes(k)) o.classList.add('ok');
      else if (got.includes(k)) o.classList.add('bad');
    });
  }

  if (!P[ti]) P[ti] = [null, null, null];
  const sudahBenar = P[ti][qi] === 1;

  if (!got.length || got.every(g => g === null)) {
    $('f' + qi).innerHTML = '<div class="fb bad">Pilih jawaban dahulu.</div>';
    return;
  }

  if (!ok && !sudahBenar) {
    if (!P.wrongCount[ti]) P.wrongCount[ti] = 0;
    if (!P[ti + '_wrong_' + qi]) {
      P[ti + '_wrong_' + qi] = true;
      P.wrongCount[ti] = (P.wrongCount[ti] || 0) + 1;
    }
  }

  if (ok) {
    P[ti][qi] = 1;
  } else {
    P[ti][qi] = 0;
  }
  save();

  const ky = q.t === 'kat'
    ? q.key.map((k, r) => `${L[r]}: ${q.heads[k]}`).join(' · ')
    : q.key.join(', ');

  $('f' + qi).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '<b>Tepat!</b>' : '<b>Belum tepat.</b> Baca lagi materi dan langkah strategi, lalu coba pahami jawabannya.'} Kunci: <b>${ky}</b></div>`;
}

// ====== KIRIM LAPORAN ======
async function sendReport() {
  if (sending || P.reported) return;
  if (P.elapsed < MIN_DETIK) { alert('Waktu belajar belum mencapai 15 menit. Terus belajar ya!'); return; }
  if (photoCount() < PHOTO_TOPICS.length) { alert('Foto catatan untuk topik 1–3 harus lengkap dulu.'); return; }
  if (!P.student) { alert('Data siswa tidak ditemukan.'); return; }

  const btn = $('btn-send');
  const status = $('send-status');
  sending = true;
  btn.disabled = true;
  btn.textContent = '⏳ Mengirim...';
  status.className = 'send-status info';
  status.textContent = 'Sedang mengirim laporan dan foto, mohon tunggu...';

  const data = {
    action: 'addLaporan',
    nama: P.student.nama,
    kelas: P.student.kelas,
    waktuBelajarMenit: Math.floor(P.elapsed / 60),
    waktuBelajarDetik: P.elapsed,
    jumlahSalah: getWrongCount(),
    waktuKirim: new Date().toISOString()
  };
  PHOTO_TOPICS.forEach((ti, n) => {
    data['judulTopik' + (n + 1)] = TOPICS[ti].judul;
    data['foto' + (n + 1)] = PH[ti];
  });

  try {
    // text/plain = "simple request", tidak kena preflight CORS (sama seperti jurnal guru)
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    const out = JSON.parse(await res.text());
    if (out.duplicate) {
      P.reported = true; save();
      status.className = 'send-status ok';
      status.textContent = '✅ ' + (out.error || 'Laporan atas nama ini sudah pernah diterima guru.');
      return;
    }
    if (!out.success) throw new Error(out.error || 'Server menolak data');
    P.reported = true;
    save();
    status.className = 'send-status ok';
    status.textContent = '✅ Laporan dan 3 foto berhasil terkirim ke guru! Tidak perlu mengirim ulang.';
  } catch (err) {
    console.error(err);
    status.className = 'send-status err';
    status.textContent = 'Gagal mengirim: ' + (err.message || 'periksa koneksi internet') + '. Foto tetap tersimpan di perangkat, silakan coba kirim lagi.';
  } finally {
    sending = false;
    refreshSendUI();
  }
}

// ====== INIT ======
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showResumeModal() {
  const o = document.createElement('div');
  o.className = 'modal-overlay';
  o.innerHTML = `
    <div class="modal-box">
      <h2>👋 Data belajar ditemukan</h2>
      <p>Perangkat ini masih menyimpan data atas nama <b>${esc(P.student.nama)}</b> (${esc(P.student.kelas)}):
      waktu belajar <b>${formatTime(P.elapsed)}</b>, <b>${photoCount()}/${PHOTO_TOPICS.length}</b> foto catatan.
      ${P.reported ? 'Laporan sudah <b>terkirim</b>.' : 'Laporan <b>belum dikirim</b>.'}</p>
      <button class="btn" id="btn-resume">Lanjutkan sebagai ${esc(P.student.nama)}</button>
      <button class="btn alt" id="btn-reset">Mulai baru</button>
      <p style="margin:10px 0 0;font-size:.8em;color:#666">Jika HP ini dipakai bergantian, pilih "Mulai baru". Data lama (nama, waktu, jawaban, foto) akan dihapus dari perangkat ini.</p>
    </div>`;
  document.body.appendChild(o);
  $('btn-resume').onclick = () => {
    o.remove();
    P.lastTick = Date.now(); // waktu saat popup terbuka tidak dihitung
    save();
    startTimer();
    renderHome();
  };
  let armed = false;
  $('btn-reset').onclick = () => {
    const b = $('btn-reset');
    if (!armed) {
      armed = true;
      b.textContent = '⚠️ Ya, hapus semua data & mulai baru';
      b.style.background = '#fde8ea';
      b.style.color = '#dc3545';
      return;
    }
    resetting = true; // cegah penyimpanan ulang data lama
    if (timerInterval) clearInterval(timerInterval);
    try { localStorage.removeItem(KEY); localStorage.removeItem(PHOTO_KEY); } catch(e) {}
    P = { wrongCount: {}, student: null, elapsed: 0, lastTick: null, reported: false };
    PH = {};
    resetting = false;
    o.remove();
    showModal();
  };
}

if (!P.student) {
  showModal();
} else {
  showResumeModal();
}
