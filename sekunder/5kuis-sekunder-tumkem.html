<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARENA — PERTUMBUHAN SEKUNDER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
    width:100%; height:100%; overflow:hidden; 
    font-family: 'Rajdhani', sans-serif;
    background:#060c14; user-select: none; 
}

/* === HEADER === */
#header {
    height: 52px;
    background: linear-gradient(90deg,#060c14 0%,#0d2137 35%,#0d2137 65%,#060c14 100%);
    border-bottom: 2px solid #f0c040;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; flex-shrink: 0;
}
#header h1 { 
    font-family: 'Orbitron', monospace;
    font-size: 16px; font-weight: 900; color: #f0c040; 
    text-transform: uppercase; letter-spacing: 3px; 
}
#round-info {
    font-family: 'Orbitron', monospace;
    font-size: 12px; color: #8ab4d0;
    background: rgba(240,192,64,0.1);
    border: 1px solid rgba(240,192,64,0.3);
    padding: 3px 12px; border-radius: 20px; letter-spacing: 1px;
}
#round-info span { color: #f0c040; font-weight: 900; }

/* === ARENA === */
#arena { display: flex; height: calc(100vh - 52px); width: 100%; }

.panel { 
    flex: 1; display: flex; flex-direction: column; overflow: hidden; 
    border-right: 1px solid rgba(255,255,255,0.06); position: relative;
}
.panel:last-child { border-right: none; }
.panel[data-p="0"] { background: #080f1c; }
.panel[data-p="1"] { background: #060f0c; }
.panel[data-p="2"] { background: #120a04; }

/* Panel header */
.panel-header { 
    padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; 
    color: #fff; font-weight: 700; font-size: 14px; letter-spacing: 1px; flex-shrink: 0;
}
.panel[data-p="0"] .panel-header { background: linear-gradient(90deg,#1a3a5c,#0f2540); border-bottom: 2px solid #2a6fa8; }
.panel[data-p="1"] .panel-header { background: linear-gradient(90deg,#0f6e56,#094d3c); border-bottom: 2px solid #16a085; }
.panel[data-p="2"] .panel-header { background: linear-gradient(90deg,#853d1e,#5c2a10); border-bottom: 2px solid #e67e22; }

.ph-name { display: flex; align-items: center; gap: 5px; font-family: 'Orbitron', monospace; font-size: 10px; }
.ph-score { 
    font-family: 'Orbitron', monospace; font-size: 10px;
    background: rgba(240,192,64,0.15); border: 1px solid rgba(240,192,64,0.4);
    color: #f0c040; padding: 2px 7px; border-radius: 10px;
}

/* Stage progress bar */
.stage-progress { height: 3px; width: 100%; display: flex; flex-shrink: 0; }
.sp-seg { flex: 1; background: rgba(255,255,255,0.06); margin: 0 1px; transition: background 0.3s; }
.sp-seg.done { background: #f0c040; }
.sp-seg.active { background: rgba(240,192,64,0.45); }

/* Panel body */
.panel-body { 
    flex: 1; padding: 12px 12px; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; overflow: hidden;
}

/* Stage badge */
.stage-badge { 
    font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; padding: 3px 12px; border-radius: 12px; margin-bottom: 6px;
    border: 1px solid currentColor; flex-shrink: 0;
}
.stage-badge.s1 { color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.1); }
.stage-badge.s2 { color: #3498db; border-color: #3498db; background: rgba(52,152,219,0.1); }

.stage-desc { color: #5a7f98; font-size: 11px; margin-bottom: 9px; text-align: center; line-height: 1.4; flex-shrink: 0; }

/* ===== GAME PEMBUKA: PANTUL BILLIARD ===== */
.billiard-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 2/1;
    background-color: #0a5c36;
    border: 8px solid #8b5a2b;
    border-radius: 8px;
    cursor: crosshair;
    overflow: hidden;
    flex-shrink: 0;
}
.billiard-container .pocket {
    position: absolute;
    width: 52px;
    height: 52px;
    background-color: #111;
    border-radius: 50%;
    bottom: -12px;
    right: -12px;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
}
.billiard-container #ball {
    position: absolute;
    width: 16px;
    height: 16px;
    background-color: #e74c3c;
    border-radius: 50%;
    box-shadow: inset -3px -3px 5px rgba(0,0,0,0.4), 2px 2px 4px rgba(0,0,0,0.3);
    z-index: 10;
    transition: none;
}
.billiard-container #aim-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
}
.billiard-container #aim-line {
    stroke: rgba(255, 255, 255, 0.6);
    stroke-width: 2;
    stroke-dasharray: 6, 6;
}
.billiard-status {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    color: #8ab4d0;
    margin-top: 8px;
    text-align: center;
    letter-spacing: 0.5px;
    min-height: 20px;
}
.billiard-status.success { color: #2ecc71; }
.billiard-status.fail { color: #e74c3c; }

/* ===== SOAL INTI: ESAI SUSUN-KATA ===== */
.q-card { 
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); 
    border-radius: 12px; padding: 14px 12px; width: 100%; max-width: 420px;
    margin-bottom: 12px; text-align: center; flex-shrink: 0;
}
.q-number { 
    font-size: 10px; color: #5a7f98; letter-spacing: 1px; margin-bottom: 7px; 
    font-family:'Orbitron',monospace; display: flex; align-items:center; justify-content:center; gap:6px;
}
.q-text { color: #e8f0f8; font-size: 16px; font-weight: 600; line-height: 1.5; }

.w-tries-row { 
    display:flex; align-items:center; justify-content:space-between; width:100%; max-width:420px; margin-bottom:8px;
}
.w-tries-info { font-family:'Orbitron',monospace; font-size:11px; color:#5a7f98; }
.w-score-preview { font-family:'Orbitron',monospace; font-size:11px; color:#f0c040; }

.built-word { 
    min-height: 48px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
    font-family: 'Rajdhani',sans-serif; font-weight: 700; font-size: 15px; color: #f0c040;
    letter-spacing: 0.5px; text-align: center; width: 100%; max-width: 420px; line-height: 1.4;
    display: flex; align-items: center; justify-content: center; flex-shrink:0;
}
.parts-wrap { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; width:100%; max-width:480px; }
.part-btn { 
    padding: 10px 14px; background: rgba(42,111,168,0.25); 
    border: 1px solid #2a6fa8; color: #80c8f0; 
    font-family: 'Rajdhani',sans-serif; font-weight: 700; font-size: 17px;
    border-radius: 8px; cursor: pointer; transition: all 0.12s;
    letter-spacing: 0.5px;
}
.part-btn:active:not(:disabled) { transform: scale(0.95); }
.part-btn:disabled { opacity: 0.15; cursor: default; }
.part-btn.wrong-flash { background: rgba(231,76,60,0.35); border-color: #e74c3c; color:#e74c3c; }

.built-word.correct-complete { 
    border-color: #2ecc71; background: rgba(46,204,113,0.1); color: #b8f0c8; 
    font-size: 16px;
}
.essay-result-msg { 
    font-family:'Orbitron',monospace; font-size: 13px; color: #2ecc71; 
    text-align: center; margin-bottom: 12px; letter-spacing: 0.5px;
}
.essay-read-countdown { 
    font-size: 13px; color: #8ab4d0; text-align: center; line-height: 1.5; 
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 10px 12px; width: 100%; max-width: 420px;
}
.essay-timer {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    color: #f0c040;
    background: rgba(240,192,64,0.1);
    border: 1px solid rgba(240,192,64,0.3);
    padding: 2px 12px;
    border-radius: 20px;
    letter-spacing: 1px;
}
.essay-timer.warning { color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.15); }

/* ===== FINISH ===== */
.finish-box { text-align: center; color: #fff; }
.finish-medal { font-size: 40px; margin-bottom: 6px; animation: medalPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes medalPop { 0%{transform:scale(0) rotate(-20deg);} 100%{transform:scale(1) rotate(0);} }
.finish-rank-text { font-family:'Orbitron',monospace; font-size:13px; color:#f0c040; font-weight:900; margin-bottom:5px; letter-spacing:2px; }
.finish-sub { color:#5a7f98; font-size:11px; margin-bottom:5px; }
.finish-score-big { font-family:'Orbitron',monospace; font-size:22px; color:#fff; font-weight:900; }
.finish-score-big span { color:#f0c040; }
.restart-btn { 
    margin-top: 14px; padding: 9px 22px; border: none; 
    background: linear-gradient(90deg,#f0c040,#e8a020); color: #000; 
    font-family: 'Orbitron',monospace; font-weight: 700; border-radius: 6px; cursor: pointer; 
    text-transform: uppercase; font-size: 9px; letter-spacing: 2px;
    box-shadow: 0 0 18px rgba(240,192,64,0.4);
}

/* Flash overlay */
.flash-correct { animation: flashGreen 0.35s ease; }
.flash-wrong   { animation: flashRed   0.35s ease; }
@keyframes flashGreen { 0%,100%{background:transparent} 50%{background:rgba(46,204,113,0.13)} }
@keyframes flashRed   { 0%,100%{background:transparent} 50%{background:rgba(231,76,60,0.13)} }
</style>
</head>
<body>

<div id="header">
    <h1>🦴 KUIS PERTUMBUHAN SEKUNDER - ARIEF RACHMAN</h1>
    <div id="round-info">PUTARAN <span id="round-num">1</span> / 10</div>
</div>
<div id="arena">
    <div class="panel" data-p="0" id="p-0"></div>
    <div class="panel" data-p="1" id="p-1"></div>
    <div class="panel" data-p="2" id="p-2"></div>
</div>

<script>
// ============================================================
//  AUDIO
// ============================================================
function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime;
        if (type==='tap') {
            o.type='sine'; o.frequency.setValueAtTime(800,t); o.frequency.linearRampToValueAtTime(600,t+0.05);
            g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
            o.start(t); o.stop(t+0.1);
        } else if (type==='correct') {
            o.type='triangle'; o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(784,t+0.06);
            g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
            o.start(t); o.stop(t+0.18);
        } else if (type==='wrong') {
            o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.setValueAtTime(160,t+0.1);
            g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
            o.start(t); o.stop(t+0.2);
        } else if (type==='done') {
            [523,659,784,1047].forEach((f,i)=>{
                const o2=ctx.createOscillator(), g2=ctx.createGain();
                o2.connect(g2); g2.connect(ctx.destination);
                o2.type='triangle'; o2.frequency.setValueAtTime(f, t+i*0.11);
                g2.gain.setValueAtTime(0.09, t+i*0.11); g2.gain.exponentialRampToValueAtTime(0.001, t+i*0.11+0.15);
                o2.start(t+i*0.11); o2.stop(t+i*0.11+0.15);
            });
        }
    } catch(e){}
}

// ============================================================
//  POIN BERBASIS JUMLAH KLIK SALAH (SOAL INTI)
// ============================================================
function calcScoreByMistakes(wrongCount) {
    if (wrongCount <= 2) return 10;
    if (wrongCount <= 4) return 8;
    return 6;
}

// ============================================================
//  BANK SOAL INTI (ESAI — SUSUN KATA JADI KALIMAT JAWABAN)
// ============================================================
const ESSAY_POOL = [
  {
    q: "Apa yang dimaksud dengan pertumbuhan sekunder?",
    answer: "Proses penambahan diameter pada organ tumbuhan",
    distractors: ["pelebaran", "tinggi", "batang", "akar"]
  },
  {
    q: "Organ tumbuhan utama yang mengalami pertumbuhan sekunder?",
    answer: "Bagian organ batang dan akar tumbuhan",
    distractors: ["daun", "bunga", "buah", "Biji"]
  },
  {
    q: "Aktivitas jaringan meristem yang menyebabkan terjadinya pertumbuhan sekunder?",
    answer: "Aktivitas jaringan meristem lateral atau kambium",
    distractors: ["sel", "batang", "primer", "proses"]
  },
  {
    q: "Dua jenis kambium yang terlibat langsung dalam proses pertumbuhan sekunder",
    answer: "Jenis kambium vaskuler dan kambium gabus",
    distractors: ["apikal", "lateral", "sekunder", "primer"]
  },
  {
    q: "Jaringan apa yang terbentuk ketika kambium vaskuler membelah ke arah dalam batang?",
    answer: "Terjadi pembentukan jaringan xilem sekunder tumbuhan",
    distractors: ["floem", "primer", "gabus", "korteks"]
  },
  {
    q: "Jaringan apa yang terbentuk ketika kambium vaskuler aktif membelah ke arah luar?",
    answer: "Terjadi pembentukan jaringan floem sekunder tumbuhan",
    distractors: ["xilem", "epidermis", "sel", "kayu"]
  },
  {
    q: "Faktor apa yang sangat memengaruhi aktivitas pembelahan kambium menjadi xilem dan floem?",
    answer: "Aktivitas pembelahan kambium dipengaruhi faktor lingkungan",
    distractors: ["umur", "penambahan", "diameter", "cahaya"]
  },
  {
    q: "Fenomena apa yang muncul pada irisan melintang batang akibat perbedaan aktivitas pembelahan kambium?",
    answer: "Terbentuknya lingkaran tahun pada batang pohon",
    distractors: ["akar", "bertambah", "jaringan", "xilem"]
  },
  {
    q: "Apa fungsi utama dari jaringan xilem atau pembuluh kayu pada tumbuhan berpembuluh?",
    answer: "Mengangkut air dari akar ke daun",
    distractors: ["fotosintesis", "hasil", "perlindungan", "tanah"]
  },
  {
    q: "Jaringan apa yang bertugas mengedarkan zat makanan hasil fotosintesis ke seluruh bagian tumbuhan?",
    answer: "Floem berfungsi mengedarkan zat hasil fotosintesis",
    distractors: ["xilem", "menambah", "menyerap", "air"]
  },
  {
    q: "Apa nama ilmiah dari jaringan kambium gabus?",
    answer: "Jaringan kambium gabus disebut sebagai felogen",
    distractors: ["xilem", "vaskuler", "dinamakan", "floem"]
  },
  {
    q: "Mengapa kambium gabus (felogen) perlu aktif membelah membentuk lapisan pelindung baru?",
    answer: "Menggantikan jaringan epidermis yang telah rusak",
    distractors: ["kayu", "menyerap", "buah", "bertambah"]
  }
];

// ============================================================
//  CONFIG
// ============================================================
const PLAYERS   = ["Siswa 1","Siswa 2","Siswa 3"];
const TOTAL_ROUNDS = 1;
const QUESTIONS_PER_ROUND = 10;
const GROUP_SIZE = 2;
const ESSAY_TIMER_SECONDS = 40;

let globalRound = 1;
let finishOrder = [];
let states      = [];
let roundActive = true;

// ============================================================
//  UTIL
// ============================================================
function shuffle(arr) { return [...arr].sort(()=>Math.random()-0.5); }

function pickEssayQuestions(n) {
    return shuffle(ESSAY_POOL).slice(0, n);
}

function buildEssayQuestion(item) {
    const answerWords = item.answer.split(' ');
    const n = answerWords.length;
    const pool = answerWords.map((w,i)=>({ id:i, word:w }));
    const poolMap = {};
    pool.forEach(x=>poolMap[x.id]=x);

    const firstId = 0;
    const lastId  = n - 1;
    const middleItems = pool.slice(1, n-1);

    const distractors = shuffle(item.distractors).map((w,i)=>({ id: n+i, word:w }));
    distractors.forEach(x=>poolMap[x.id]=x);

    const combined = [...middleItems, ...distractors];
    return {
        question: item.q,
        answerLen: n,
        firstId, lastId,
        poolShuffled: shuffle(combined),
        poolMap
    };
}

// ============================================================
//  INIT
// ============================================================
function initBilliard(pi) {
    const st = states[pi];
    st.billiard = {
        posX: 15 + Math.random() * 25, // % dari lebar container (kiri)
        posY: 20 + Math.random() * 60, // % dari tinggi container
        isMoving: false,
        bounceCount: 0,
        completed: false,
        failed: false
    };
}

function initRound() {
    roundActive = true;
    finishOrder = [];
    document.getElementById('round-num').textContent = globalRound;

    states = PLAYERS.map((name,idx) => ({
        name, idx,
        phase: 'opener',
        score: 0,
        essayQuestions: pickEssayQuestions(QUESTIONS_PER_ROUND),
        essayIdx: 0,
        currentQ: null,
        builtIds: [],
        wrongCount: 0,
        wrongFlashId: null,
        completed: false,
        lastPts: 0,
        readSecondsLeft: 0,
        readInterval: null,
        finished: false,
        billiard: null,
        timerSeconds: ESSAY_TIMER_SECONDS,
        timerInterval: null,
        timerRunning: false,
    }));
    states.forEach((_,i)=>initBilliard(i));
    states.forEach((_,i)=>renderPanel(i));
    // Setup billiard setelah render
    setTimeout(() => {
        states.forEach((st, i) => {
            if (st.phase === 'opener') setupBilliard(i);
        });
    }, 150);
}

// ============================================================
//  RENDER
// ============================================================
function renderPanel(pi) {
    const st = states[pi];
    const el = document.getElementById(`p-${pi}`);
    if (!el) return;

    const seg = s => `<div class="sp-seg ${st.essayIdx>=s?'done':((st.phase==='essay'&&st.essayIdx===s-1)?'active':'')}"></div>`;
    const bar = `<div class="stage-progress">${Array.from({length:QUESTIONS_PER_ROUND},(_,i)=>i+1).map(seg).join('')}</div>`;

    const icons = ['🦴','🫀','💪'];
    const header = `<div class="panel-header">
        <div class="ph-name">${icons[pi]} ${st.name}</div>
        <div class="ph-score">⚡ ${st.score}pt</div>
    </div>${bar}`;

    let body = '';

    if (st.finished) {
        const rank   = finishOrder.indexOf(pi);
        const medals = ['🥇','🥈','🥉'];
        const labels = ['JUARA 1','JAGOAN 2','MANTAP 3'];
        const showBtn = finishOrder.length===PLAYERS.length && pi===finishOrder[0];
        body = `<div class="panel-body"><div class="finish-box">
            <div class="finish-medal">${medals[rank]||'🎉'}</div>
            <div class="finish-rank-text">${labels[rank]||'FINISH'}</div>
            <div class="finish-sub">Skor Putaran ${globalRound}</div>
            <div class="finish-score-big">⚡ <span>${st.score}</span> poin</div>
            ${showBtn?`<button class="restart-btn" onclick="nextRound()">▶ ${globalRound<TOTAL_ROUNDS?'PUTARAN '+(globalRound+1):'SELESAI'}</button>`:''}
        </div></div>`;

    } else if (st.phase==='opener') {
        body = renderBilliardBody(pi);

    } else if (st.phase==='essay') {
        body = renderEssayBody(pi);
    }

    el.innerHTML = header + body;
}

// ============================================================
//  GAME PEMBUKA: BILLIARD PANTUL
// ============================================================
function renderBilliardBody(pi) {
    const st = states[pi];
    const b = st.billiard;

    let statusText = '🎯 Arahkan garis & klik untuk menembak!';
    let statusClass = '';
    if (b.completed) {
        statusText = '✅ Tembakan sempurna! Lanjut ke soal...';
        statusClass = 'success';
    } else if (b.isMoving) {
        statusText = '🎱 Bola meluncur...';
    } else if (b.failed) {
        statusText = '❌ Gagal! Klik tombol di bawah untuk mengacak ulang.';
        statusClass = 'fail';
    }

    const resetBtn = b.failed ? `<button style="margin-top:6px;padding:6px 16px;background:#e67e22;color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;" onclick="resetBilliard(${pi})">🔄 Acak Ulang Posisi Bola</button>` : '';

    return `<div class="panel-body">
        <div class="stage-badge s1">🎯 GAME FOKUS</div>
        <div class="stage-desc">Tembak bola merah ke lubang kanan bawah dengan <b>tepat 1 kali pantulan</b>!</div>
        <div class="billiard-container" id="billiard-${pi}">
            <svg id="aim-svg-${pi}" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;">
                <line id="aim-line-${pi}" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,6" />
            </svg>
            <div class="pocket"></div>
            <div id="ball-${pi}" style="position:absolute;width:16px;height:16px;background-color:#e74c3c;border-radius:50%;box-shadow:inset -3px -3px 5px rgba(0,0,0,0.4),2px 2px 4px rgba(0,0,0,0.3);z-index:10;left:${b.posX}%;top:${b.posY}%;"></div>
        </div>
        <div class="billiard-status ${statusClass}" id="billiard-status-${pi}">${statusText}</div>
        ${resetBtn}
    </div>`;
}

function resetBilliard(pi) {
    const st = states[pi];
    if (st.finished || st.phase !== 'opener') return;
    initBilliard(pi);
    renderPanel(pi);
    setTimeout(() => setupBilliard(pi), 50);
}

function setupBilliard(pi) {
    const st = states[pi];
    if (!st || st.phase !== 'opener') return;
    const container = document.getElementById(`billiard-${pi}`);
    if (!container) return;

    // Hapus semua event listener dengan clone
    const newContainer = container.cloneNode(true);
    container.parentNode.replaceChild(newContainer, container);

    // Ambil elemen
    const ball = newContainer.querySelector(`#ball-${pi}`);
    const aimLine = newContainer.querySelector(`#aim-line-${pi}`);
    const b = st.billiard;

    // Pastikan elemen ada
    if (!ball || !aimLine) return;

    const cw = newContainer.clientWidth || 400;
    const ch = newContainer.clientHeight || 200;
    const ballSize = 16;

    function updateBallPos() {
        if (ball) {
            const px = (b.posX / 100) * cw;
            const py = (b.posY / 100) * ch;
            ball.style.left = px + 'px';
            ball.style.top = py + 'px';
        }
    }

    // Update posisi awal
    updateBallPos();

    // Mouse move untuk garis panduan
    newContainer.addEventListener('mousemove', (e) => {
        if (b.isMoving || b.completed || b.failed) {
            aimLine.style.display = 'none';
            return;
        }
        const rect = newContainer.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const bx = (b.posX / 100 * cw) + ballSize/2;
        const by = (b.posY / 100 * ch) + ballSize/2;
        aimLine.setAttribute('x1', bx);
        aimLine.setAttribute('y1', by);
        aimLine.setAttribute('x2', mx);
        aimLine.setAttribute('y2', my);
        aimLine.style.display = 'block';
    });

    // Click untuk tembak
    newContainer.addEventListener('click', (e) => {
        if (b.isMoving || b.completed || b.failed) return;

        const rect = newContainer.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const bx = (b.posX / 100 * cw) + ballSize/2;
        const by = (b.posY / 100 * ch) + ballSize/2;

        const dx = mx - bx;
        const dy = my - by;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 5) return;

        aimLine.style.display = 'none';
        b.isMoving = true;
        b.bounceCount = 0;
        b.failed = false;
        // Catatan: sebelumnya di sini memanggil renderPanel(pi) yang mengganti
        // seluruh innerHTML panel (termasuk elemen bola & garis bidik yang
        // sedang dipakai animasi), sehingga bola jadi tidak terlihat memantul.
        // Sekarang cukup update teks status secara langsung tanpa merusak DOM animasi.
        const statusEl = document.getElementById(`billiard-status-${pi}`);
        if (statusEl) {
            statusEl.textContent = '🎱 Bola meluncur...';
            statusEl.className = 'billiard-status';
        }

        const speed = 5;
        const POCKET_ZONE = 60; // area tangkap lubang diperbesar (sebelumnya ~35-38px) biar gampang masuk, ini cuma game pemanasan
        let vx = (dx / dist) * speed;
        let vy = (dy / dist) * speed;
        let posX = (b.posX / 100) * cw;
        let posY = (b.posY / 100) * ch;

        let animId = null;
        let lastTime = 0;

        function animateBilliard(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = Math.min(timestamp - lastTime, 30);
            lastTime = timestamp;

            const steps = Math.ceil(delta / 8);
            for (let i = 0; i < steps; i++) {
                posX += vx * 0.8;
                posY += vy * 0.8;

                // Pantulan Dinding Atas
                if (posY <= 0) {
                    posY = 0;
                    vy = -vy;
                    b.bounceCount++;
                    playSound('tap');
                }
                // Pantulan Dinding Bawah
                else if (posY >= ch - ballSize) {
                    // Cek lubang kanan bawah (area diperbesar biar gampang masuk)
                    if (posX >= cw - POCKET_ZONE) {
                        if (b.bounceCount === 1) {
                            b.completed = true;
                            b.isMoving = false;
                            b.posX = (posX / cw) * 100;
                            b.posY = (posY / ch) * 100;
                            playSound('done');
                            renderPanel(pi);
                            setTimeout(() => advanceFromOpener(pi), 1200);
                            return;
                        } else {
                            b.isMoving = false;
                            b.failed = true;
                            playSound('wrong');
                            renderPanel(pi);
                            return;
                        }
                    }
                    posY = ch - ballSize;
                    vy = -vy;
                    b.bounceCount++;
                    playSound('tap');
                }

                // Pantulan Dinding Kiri
                if (posX <= 0) {
                    posX = 0;
                    vx = -vx;
                    b.bounceCount++;
                    playSound('tap');
                }
                // Pantulan Dinding Kanan
                else if (posX >= cw - ballSize) {
                    // Cek lubang kanan bawah juga dari sisi kanan (biar bola yang
                    // datang dari arah kanan tetap dihitung peluang masuk, bukan langsung gagal)
                    if (posY >= ch - POCKET_ZONE) {
                        if (b.bounceCount === 1) {
                            b.completed = true;
                            b.isMoving = false;
                            b.posX = (posX / cw) * 100;
                            b.posY = (posY / ch) * 100;
                            playSound('done');
                            renderPanel(pi);
                            setTimeout(() => advanceFromOpener(pi), 1200);
                            return;
                        } else {
                            b.isMoving = false;
                            b.failed = true;
                            playSound('wrong');
                            renderPanel(pi);
                            return;
                        }
                    }
                    posX = cw - ballSize;
                    vx = -vx;
                    b.bounceCount++;
                    playSound('tap');
                }

                if (b.bounceCount > 6) {
                    b.isMoving = false;
                    b.failed = true;
                    playSound('wrong');
                    renderPanel(pi);
                    return;
                }
            }

            b.posX = (posX / cw) * 100;
            b.posY = (posY / ch) * 100;
            updateBallPos();

            if (b.isMoving && !b.completed && !b.failed) {
                animId = requestAnimationFrame(animateBilliard);
            }
        }

        animId = requestAnimationFrame(animateBilliard);
    });

    // Handle resize
    const resizeObserver = new ResizeObserver(() => {
        const newCw = newContainer.clientWidth;
        const newCh = newContainer.clientHeight;
        if (newCw > 0 && newCh > 0) {
            updateBallPos();
        }
    });
    resizeObserver.observe(newContainer);
}

function advanceFromOpener(pi) {
    const st = states[pi];
    if (st.finished) return;
    st.phase = 'essay';
    st.currentQ = buildEssayQuestion(st.essayQuestions[st.essayIdx]);
    st.builtIds = [st.currentQ.firstId];
    st.wrongCount = 0;
    st.completed = false;
    st.timerSeconds = ESSAY_TIMER_SECONDS;
    st.timerRunning = false;
    if (st.timerInterval) { clearInterval(st.timerInterval); st.timerInterval = null; }
    renderPanel(pi);
    setTimeout(() => startEssayTimer(pi), 300);
}

// ============================================================
//  SOAL INTI dengan TIMER 45 DETIK
// ============================================================
function startEssayTimer(pi) {
    const st = states[pi];
    if (st.finished || st.phase !== 'essay' || st.completed) return;
    if (st.timerRunning) return;
    st.timerRunning = true;
    st.timerSeconds = ESSAY_TIMER_SECONDS;
    if (st.timerInterval) clearInterval(st.timerInterval);
    st.timerInterval = setInterval(() => {
        st.timerSeconds--;
        renderPanel(pi);
        if (st.timerSeconds <= 0) {
            clearInterval(st.timerInterval);
            st.timerInterval = null;
            st.timerRunning = false;
            // Waktu habis -> otomatis dapat 3 poin, lanjut
            st.score += 3;
            st.lastPts = 3;
            st.completed = true;
            playSound('done');
            renderPanel(pi);
            setTimeout(() => {
                proceedAfterEssay(pi);
            }, 1500);
        }
    }, 1000);
}

function renderEssayBody(pi) {
    const st = states[pi];
    const q  = st.currentQ;
    const builtWordsText = renderBuiltSentence(st, q);

    const timerDisplay = st.timerRunning ? 
        `<span class="essay-timer ${st.timerSeconds <= 10 ? 'warning' : ''}">⏱ ${st.timerSeconds}s</span>` :
        `<span class="essay-timer">⏱ --</span>`;

    if (st.completed) {
        return `<div class="panel-body">
            <div class="stage-badge s2">📝 SOAL INTI</div>
            <div class="q-card">
                <div class="q-number">SOAL ${st.essayIdx+1} / ${QUESTIONS_PER_ROUND} · KELOMPOK ${Math.floor(st.essayIdx/GROUP_SIZE)+1}</div>
                <div class="q-text">${q.question}</div>
            </div>
            <div class="built-word correct-complete">${builtWordsText}</div>
            <div class="essay-result-msg">✅ Jawaban benar! +${st.lastPts} poin</div>
            <div class="essay-read-countdown">⏳ Lanjut dalam ${st.readSecondsLeft} detik — baca dulu jawabannya!</div>
        </div>`;
    }

    const wordButtons = q.poolShuffled.map(item=>{
        const used = st.builtIds.includes(item.id);
        const wrongFlash = st.wrongFlashId===item.id ? ' wrong-flash' : '';
        return `<button class="part-btn${wrongFlash}" ${used?'disabled':''} onclick="doClickWord(${pi},${item.id})">${item.word}</button>`;
    }).join('');

    return `<div class="panel-body">
        <div class="stage-badge s2">📝 SOAL INTI</div>
        <div class="stage-desc">Kata awal &amp; akhir sudah tersedia — lengkapi bagian tengah kalimat secara berurutan!</div>
        <div class="q-card">
            <div class="q-number">SOAL ${st.essayIdx+1} / ${QUESTIONS_PER_ROUND} · KELOMPOK ${Math.floor(st.essayIdx/GROUP_SIZE)+1} ${timerDisplay}</div>
            <div class="q-text">${q.question}</div>
        </div>
        <div class="w-tries-row">
            <div class="w-tries-info">❌ Salah: ${st.wrongCount}x</div>
            <div class="w-score-preview">✦ Jika benar sekarang = ${calcScoreByMistakes(st.wrongCount)} poin</div>
        </div>
        <div class="built-word">${builtWordsText}</div>
        <div class="parts-wrap">${wordButtons}</div>
    </div>`;
}

function renderBuiltSentence(st, q) {
    const firstWord = q.poolMap[q.firstId].word;
    const lastWord   = q.poolMap[q.lastId].word;
    const middleDone = st.builtIds.filter(id => id > q.firstId && id < q.lastId);
    const middleText = middleDone.map(id => q.poolMap[id].word).join(' ');
    const isComplete = st.builtIds.includes(q.lastId);

    if (isComplete) return `${firstWord} ${middleText} ${lastWord}`;
    if (middleText) return `${firstWord} ${middleText} · · · ${lastWord}`;
    return `${firstWord} · · · ${lastWord}`;
}

// ============================================================
//  GAME LOGIC — SOAL INTI
// ============================================================
function doClickWord(pi, id) {
    if (!roundActive) return;
    const st = states[pi];
    if (st.finished || st.phase !== 'essay') return;
    if (st.builtIds.includes(id)) return;
    if (st.completed) return;

    const q = st.currentQ;
    const expected = st.builtIds.length;

    if (id === expected && id < q.lastId) {
        st.builtIds.push(id);
        playSound('correct');

        if (st.builtIds.length === q.answerLen - 1) {
            st.builtIds.push(q.lastId);
        }

        if (st.builtIds.length === q.answerLen) {
            const pts = calcScoreByMistakes(st.wrongCount);
            st.score += pts;
            st.lastPts = pts;
            st.completed = true;
            if (st.timerInterval) { clearInterval(st.timerInterval); st.timerInterval = null; st.timerRunning = false; }
            playSound('done');
            document.getElementById(`p-${pi}`).classList.add('flash-correct');
            setTimeout(()=>document.getElementById(`p-${pi}`).classList.remove('flash-correct'),350);

            st.readSecondsLeft = 10;
            renderPanel(pi);
            if (st.readInterval) clearInterval(st.readInterval);
            st.readInterval = setInterval(()=>{
                st.readSecondsLeft--;
                if (st.readSecondsLeft <= 0) {
                    clearInterval(st.readInterval);
                    st.readInterval = null;
                    proceedAfterEssay(pi);
                    return;
                }
                renderPanel(pi);
            }, 1000);
            return;
        }
        renderPanel(pi);
    } else {
        st.wrongCount++;
        playSound('wrong');
        st.wrongFlashId = id;
        renderPanel(pi);
        setTimeout(()=>{ if(states[pi]){ states[pi].wrongFlashId=null; renderPanel(pi);} }, 300);
    }
}

function proceedAfterEssay(pi) {
    const st = states[pi];
    if (st.timerInterval) { clearInterval(st.timerInterval); st.timerInterval = null; st.timerRunning = false; }
    st.essayIdx++;

    if (st.essayIdx >= QUESTIONS_PER_ROUND) {
        st.finished = true;
        st.phase = 'finish';
        finishOrder.push(pi);
        if (finishOrder.length === PLAYERS.length) roundActive = false;
        states.forEach((_,i)=>renderPanel(i));
        return;
    }

    if (st.essayIdx % GROUP_SIZE === 0) {
        st.phase = 'opener';
        initBilliard(pi);
        renderPanel(pi);
        setTimeout(() => setupBilliard(pi), 50);
    } else {
        st.currentQ = buildEssayQuestion(st.essayQuestions[st.essayIdx]);
        st.builtIds = [st.currentQ.firstId];
        st.wrongCount = 0;
        st.completed = false;
        st.timerSeconds = ESSAY_TIMER_SECONDS;
        st.timerRunning = false;
        if (st.timerInterval) { clearInterval(st.timerInterval); st.timerInterval = null; }
        renderPanel(pi);
        setTimeout(() => startEssayTimer(pi), 300);
    }
}

// ============================================================
//  ROUND & GAME MANAGEMENT
// ============================================================
function nextRound() {
    if (globalRound >= TOTAL_ROUNDS) { showFinalScreen(); return; }
    globalRound++;
    initRound();
}

function showFinalScreen() {
    const ranked = [...states].sort((a,b)=>b.score-a.score);
    const medals = ['🥇','🥈','🥉'];
    document.getElementById('arena').innerHTML = `
        <div style="width:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:28px;">
            <div style="font-family:'Orbitron',monospace;font-size:20px;color:#f0c040;text-align:center;letter-spacing:3px;">🏆 GAME SELESAI! 🏆</div>
            <div style="font-family:'Orbitron',monospace;font-size:11px;color:#8ab4d0;text-align:center;letter-spacing:2px;">10 PUTARAN — STRUKTUR ORGANEL SEL</div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
                ${ranked.map((s,i)=>`
                    <div style="background:rgba(255,255,255,0.05);border:1px solid ${i===0?'#f0c040':'rgba(255,255,255,0.12)'};border-radius:12px;padding:18px 22px;text-align:center;min-width:110px;">
                        <div style="font-size:30px;margin-bottom:6px;">${medals[i]||'🏅'}</div>
                        <div style="font-family:'Orbitron',monospace;font-size:10px;color:#f0c040;margin-bottom:4px;">${s.name}</div>
                        <div style="font-family:'Orbitron',monospace;font-size:20px;color:#fff;">${s.score}</div>
                        <div style="font-size:10px;color:#5a7f98;">poin</div>
                    </div>`).join('')}
            </div>
            <button class="restart-btn" onclick="restartAll()">🔄 MAIN LAGI DARI AWAL</button>
        </div>`;
}

function restartAll() {
    globalRound = 1;
    document.getElementById('arena').innerHTML = `
        <div class="panel" data-p="0" id="p-0"></div>
        <div class="panel" data-p="1" id="p-1"></div>
        <div class="panel" data-p="2" id="p-2"></div>`;
    initRound();
}

// ============================================================
//  KICK OFF
// ============================================================
initRound();
</script>
